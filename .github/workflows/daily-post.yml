name: Daily VK Post

on:
  schedule:
    # 07:00 UTC = 10:00 по Москве (МСК = UTC+3, без переходов на летнее время)
    - cron: '0 7 * * *'
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой "Run workflow"

permissions:
  contents: write   # нужно, чтобы workflow мог закоммитить новый feed.xml и фото

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feed generator
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: python generate_feed.py

      - name: Commit and push updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/images feed_items.json
          git diff --staged --quiet && echo "Нечего коммитить" || git commit -m "Обновление RSS-ленты"
          git push
