name: Evening Content Post

on:
  schedule:
    - cron: '0 16 * * *'  # 16:00 UTC = 19:00 МСК
  workflow_dispatch:       # ручной запуск для теста

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run content generator
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python generate_content.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content_state.json
          git diff --staged --quiet || git commit -m "update content state [skip ci]"
          git push
