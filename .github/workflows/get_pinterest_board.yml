name: Get Pinterest Board ID

on:
  workflow_dispatch:

jobs:
  get_board_id:
    runs-on: ubuntu-latest
    steps:
      - name: Get board ID
        env:
          PINTEREST_TOKEN: ${{ secrets.PINTEREST_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $PINTEREST_TOKEN" \
          "https://api.pinterest.com/v5/boards?privacy=SECRET&page_size=25" | python3 -m json.tool
