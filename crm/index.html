class Component extends DCLogic {
  state = {
    view: 'list', current: '', tab: 'overview', q: '', filter: 'Все', tariffTab: 'all',
    clients: [], busy: null, copied: null, toast: null, saved: false, pushed: false,
    briefs: [], log: [], logFilter: 'Все',
    conn: loadConn(), props: {}, demo: false, loading: true, syncAt: 'загрузка…',
    settingsSaved: false, tested: null, deployed: {},
    showNew: false, form: { business: '', name: '', phone: '', email: '', tg: '', city: 'Санкт-Петербург' },
    newTariff: 'ПРО', newSource: 'Avito',
    payDraft: null, payCancelArm: null,
    dragRubric: null, grabRubric: null,   // перетаскивание рубрик мышью
    tariffMove: null,  // { to, keep: [имена рубрик], keepSlots: [ключи] }

    // задачи и комментарии
    tasks: [], comments: [],
    blkTasks: true, blkComments: true, showDone: false,
    commentDraft: '', commentEdit: null, commentDel: null,
    taskModal: null,   // { id, client_id, title, priority, mode, from, to, font }
    taskFilter: 'all', tasksShowDone: false
  };

  /* ---- загрузка данных ------------------------------------------- */

  /** Первая загрузка — из renderVals, чтобы не зависеть от жизненного цикла. */
  bootOnce() {
    if (this._booted) return;
    this._booted = true;
    setTimeout(() => { this.loadTariffs(); this.boot(); }, 0);
    // Esc закрывает модалки. Через разметку не сделать: движок шаблонов
    // умеет click/change/drag, но не keydown — вешаем на документ.
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape' && e.keyCode !== 27) return;
      if (this.state.taskModal) this.setState({ taskModal: null });
      else if (this.state.tariffMove) this.setState({ tariffMove: null });
    });
  }

  /**
   * Свежий реестр тарифов из ../tariffs.json (тот же репозиторий, что и
   * GitHub Pages). Молча оставляет встроенную копию, если файла нет —
   * интерфейс не должен ломаться из-за отсутствующего справочника.
   */
  loadTariffs() {
    if (typeof fetch !== 'function') return;
    fetch('../tariffs.json', { cache: 'no-cache' })
      .then(r => (r.ok ? r.json() : null))
      .then(j => {
        if (!j || !j.tariffs || !Object.keys(j.tariffs).length) return;
        TARIFFS = j;
        this.setState({});   // перерисовка с новым справочником
      })
      .catch(() => {});
  }

  /** GET clients + briefs + log + settings. Без WEBAPP_URL — демо-режим. */
  boot(silent) {
    const conn = this.state.conn;
    if (!conn.WEBAPP_URL) {
      this.setState({
        clients: DATA.map(c => Object.assign({}, c, { active: c.active !== false })),
        briefs: BRIEFS.map(b => Object.assign({}, b)), log: LOG.slice(),
        demo: true, loading: false, syncAt: 'демо-данные', props: {},
        current: DATA[0] ? DATA[0].id : ''
      });
      return;
    }
    if (!silent) this.setState({ loading: true, syncAt: 'загрузка…' });
    Promise.all([
      apiGet(conn, 'clients'),
      apiGet(conn, 'briefs'),
      apiGet(conn, 'log'),
      apiGet(conn, 'settings'),
      // Задачи и комментарии не должны валить всю загрузку: если листов
      // ещё нет (setupSheets не запускали) — просто останутся пустыми.
      apiGet(conn, 'tasks').catch(() => ({ tasks: [] })),
      apiGet(conn, 'comments').catch(() => ({ comments: [] }))
    ]).then(res => {
      const clients = (res[0].clients || []).map(c => {
        const o = fromApi(c);
        if (!o.avatar) { try { const ls = localStorage.getItem('crm_avatar_' + o.id); if (ls) o.avatar = ls; } catch(e) {} }
        return o;
      });
      this.setState(s => ({
        clients: clients,
        briefs: res[1].briefs || [],
        log: res[2].log || [],
        props: res[3].props || {},
        tasks: res[4].tasks || [],
        comments: res[5].comments || [],
        demo: false, loading: false, syncAt: res[0].at || '—',
        current: clients.some(c => c.id === s.current) ? s.current : (clients[0] ? clients[0].id : '')
      }));
    }).catch(err => {
      this.setState({ loading: false, demo: false, syncAt: 'нет связи' });
      this.flash('Не удалось загрузить данные: ' + err.message);
    });
  }

  /**
   * Одно действие за раз: remote() уходит в Web App, local() — то же
   * самое «на месте», когда бэкенд не подключён (демо-режим).
   */
  act(key, remote, local) {
    if (this.state.busy) return;
    this.setState({ busy: key });
    const done = () => this.setState({ busy: null });
    if (this.state.demo) {
      setTimeout(() => { done(); if (local) local(); }, 500);
      return;
    }
    remote().then(done, err => {
      done();
      this.flash('Ошибка: ' + ((err && err.message) || err));
    });
  }

  /** Ответ Web App -> состояние. edits — поле интерфейса, его не трогаем. */
  applyClient(raw, extra) {
    if (!raw) return;
    const next = fromApi(raw);
    this.setState(s => ({
      clients: s.clients.map(x => {
        if (x.id !== next.id) return x;
        return Object.assign({}, next, {
          // edits, screenshots и draft живут только в браузере —
          // сервер их не хранит, поэтому после любого save/push
          // они берутся из старого объекта, а не из ответа сервера
          edits: x.edits,
          screenshots: x.screenshots || [],
          draft: x.draft || null
        }, extra || {});
      }),
      syncAt: s.syncAt
    }));
  }

  /** Тихо сохраняет изменение одного-двух полей (переключатели, чек-лист). */
  quietSave(id, changes, revert) {
    if (this.state.demo) return;
    apiPost(this.state.conn, 'save', { client: Object.assign({ id: id }, changes) })
      .catch(err => {
        if (revert) this.patch(id, revert);
        this.flash('Не сохранилось: ' + err.message);
      });
  }

  uniqueId(base) {
    const taken = this.state.clients.map(c => c.id);
    let id = base || 'client';
    let n = 2;
    while (taken.indexOf(id) >= 0) { id = base + '-' + n; n++; }
    return id;
  }

  translit(s) {
    const M = { а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z', и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'c', ч: 'ch', ш: 'sh', щ: 'sch', ъ: '', ы: 'y', ь: '', э: 'e', ю: 'yu', я: 'ya' };
    return (s || '').toLowerCase().split('').map(ch => (M[ch] !== undefined ? M[ch] : /[a-z0-9]/.test(ch) ? ch : '-'))
      .join('').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 24);
  }

  flash(msg) {
    clearTimeout(this._t);
    this.setState({ toast: msg });
    this._t = setTimeout(() => this.setState({ toast: null }), 3200);
  }

  patch(id, changes) {
    this.setState(s => ({ clients: s.clients.map(c => (c.id === id ? Object.assign({}, c, changes) : c)) }));
  }

  uploadAvatar(id, file, conn) {
    if (!file || !/^image\//.test(file.type || '')) return this.flash('Это не картинка — нужен jpg или png');
    this.flash('Загружаю фото…');
    this.patch(id, { _uploading: true });

    const resize = dataUrl => new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const MAX = 240, s = Math.min(MAX / img.width, MAX / img.height, 1);
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', 0.88));
      };
      img.onerror = () => reject(new Error('браузер не смог открыть этот файл'));
      img.src = dataUrl;
    });

    /** Показываем локально: аватар виден сразу, даже если таблица недоступна. */
    const showLocal = base64 => {
      try { localStorage.setItem('crm_avatar_' + id, base64); } catch (e) {}
      this.patch(id, { avatar: base64, _uploading: false });
    };

    const reader = new FileReader();
    reader.onerror = () => { this.patch(id, { _uploading: false }); this.flash('Не удалось прочитать файл'); };
    reader.onload = ev => {
      resize(ev.target.result).then(base64 => {
        if (!conn || !conn.WEBAPP_URL) {
          showLocal(base64);
          this.flash('Фото показано локально — задайте WEBAPP_URL, чтобы сохранить в таблицу');
          return;
        }
        apiPost(conn, 'upload_avatar', { client_id: id, image: base64 })
          .then(r => {
            if (!r || !r.url) throw new Error('бэкенд не вернул ссылку на файл');
            this.patch(id, { avatar: r.url, _uploading: false });
            this.flash('Фото сохранено');
          })
          .catch(err => {
            console.error('Avatar upload:', err);
            showLocal(base64);
            this.flash('Фото не ушло в таблицу: ' + (err && err.message ? err.message : 'ошибка') + ' — показано локально');
          });
      }).catch(err => {
        this.patch(id, { _uploading: false });
        this.flash('Не удалось обработать фото: ' + err.message);
      });
    };
    reader.readAsDataURL(file);
  }

  /** Общий приём файлов: и из диалога выбора, и из перетаскивания. */
  addScreenshots(clientId, fileList) {
    const files = Array.from(fileList || []).filter(f => f && /^image\//.test(f.type || ''));
    if (!files.length) return;
    const has = ((this.state.clients.find(x => x.id === clientId) || {}).screenshots || []).length;
    const remain = SCREENSHOT_MAX - has;
    if (remain <= 0) return this.flash('Уже ' + SCREENSHOT_MAX + ' фото — удалите лишние перед добавлением');
    const batch = files.slice(0, remain);
    this.flash(batch.length === 1 ? 'Загружаю фото…' : ('Загружаю фото: ' + batch.length + '…'));
    Promise.all(batch.map(readScreenshot)).then(loaded => {
      const cur = (this.state.clients.find(x => x.id === clientId) || {}).screenshots || [];
      this.patch(clientId, { screenshots: cur.concat(loaded).slice(0, SCREENSHOT_MAX) });
      this.flash('Готово, фото добавлено: ' + loaded.length +
        (files.length > batch.length ? ' (лишние отброшены — потолок ' + SCREENSHOT_MAX + ')' : ''));
    }).catch(err => this.flash(err && err.message ? err.message : 'Не удалось загрузить скриншоты'));
  }

  cur() { return this.state.clients.find(c => c.id === this.state.current) || this.state.clients[0] || BLANK; }

  /* ---- задачи и комментарии -------------------------------------- */

  /** Перечитывает оба листа. Вызывается после каждой записи. */
  reloadTasks() {
    const conn = this.state.conn;
    if (this.state.demo || !conn.WEBAPP_URL) return Promise.resolve();
    return Promise.all([
      apiGet(conn, 'tasks').catch(() => ({ tasks: [] })),
      apiGet(conn, 'comments').catch(() => ({ comments: [] }))
    ]).then(r => this.setState({ tasks: r[0].tasks || [], comments: r[1].comments || [] }));
  }

  /**
   * Открывает модалку. Описание в contenteditable нельзя держать в
   * состоянии: движок перерисовывает текстовые узлы и сбивает курсор.
   * Поэтому HTML заливается в поле один раз, руками, после отрисовки.
   */
  openTask(task, clientId) {
    const t = task || null;
    let html = t ? String(t.description || '') : '';
    let font = 14;
    const wrap = html.match(/^\s*<span style="font-size:(\d{2})px">([\s\S]*)<\/span>\s*$/);
    if (wrap && TASK_FONTS.indexOf(Number(wrap[1])) >= 0) { font = Number(wrap[1]); html = wrap[2]; }

    this.setState({
      taskModal: {
        id: t ? t.id : '',
        client_id: t ? t.client_id : (clientId || this.state.current),
        title: t ? t.title : '',
        priority: t ? t.priority : 'blue',
        mode: !t || !t.date_from ? 'none' : (t.date_to ? 'range' : 'date'),
        from: t ? t.date_from : '',
        to: t ? t.date_to : '',
        font: font
      },
      commentDel: null
    });
    setTimeout(() => {
      const el = document.getElementById('dc-task-desc');
      if (el) el.innerHTML = sanitizeTaskHtml(html);
    }, 0);
  }

  patchModal(changes) {
    this.setState(s => ({ taskModal: Object.assign({}, s.taskModal, changes) }));
  }

  /** Описание из поля: чистим и оборачиваем в выбранный размер. */
  readDesc() {
    const el = document.getElementById('dc-task-desc');
    const m = this.state.taskModal || {};
    const inner = sanitizeTaskHtml(el ? el.innerHTML : '');
    if (!stripHtml(inner)) return '';
    const font = TASK_FONTS.indexOf(m.font) >= 0 ? m.font : 14;
    return font === 14 ? inner : '<span style="font-size:' + font + 'px">' + inner + '</span>';
  }

  saveTask() {
    const m = this.state.taskModal;
    if (!m) return;
    const title = String(m.title || '').trim();
    if (!title) { this.flash('Задаче нужно имя'); return; }
    const payload = {
      client_id: m.client_id, title: title,
      description: this.readDesc(), priority: m.priority,
      date_from: m.mode === 'none' ? '' : m.from,
      date_to: m.mode === 'range' ? m.to : ''
    };
    if (m.id) payload.id = m.id;
    const action = m.id ? 'taskUpdate' : 'taskAdd';
    this.act('task', () =>
      apiPost(this.state.conn, action, { task: payload })
        .then(() => this.reloadTasks())
        .then(() => {
          this.setState({ taskModal: null });
          this.flash(m.id ? 'Задача обновлена' : 'Задача поставлена');
        }),
      () => {
        const local = Object.assign({ id: m.id || 't-' + Date.now(), status: 'open', created: '' }, payload);
        this.setState(s => ({
          tasks: m.id ? s.tasks.map(x => (x.id === m.id ? local : x)) : s.tasks.concat([local]),
          taskModal: null
        }));
      });
  }

  /** Чекбокс: сначала меняем на месте, при ошибке откатываем. */
  toggleTask(task) {
    const next = task.status === 'done' ? 'open' : 'done';
    this.setState(s => ({ tasks: s.tasks.map(x => (x.id === task.id ? Object.assign({}, x, { status: next }) : x)) }));
    if (this.state.demo) return;
    apiPost(this.state.conn, 'taskDone', { id: task.id, done: next === 'done' })
      .catch(err => {
        this.setState(s => ({ tasks: s.tasks.map(x => (x.id === task.id ? Object.assign({}, x, { status: task.status }) : x)) }));
        this.flash('Не сохранилось: ' + err.message);
      });
  }

  removeTask() {
    const m = this.state.taskModal;
    if (!m || !m.id) return;
    this.act('taskDel', () =>
      apiPost(this.state.conn, 'taskDelete', { id: m.id })
        .then(() => this.reloadTasks())
        .then(() => { this.setState({ taskModal: null }); this.flash('Задача удалена'); }),
      () => this.setState(s => ({ tasks: s.tasks.filter(x => x.id !== m.id), taskModal: null })));
  }

  submitComment() {
    const st = this.state;
    const text = String(st.commentDraft || '').trim();
    if (!text) { this.flash('Пустой комментарий'); return; }
    const edit = st.commentEdit;
    const body = edit ? { comment: { id: edit, text: text } } : { comment: { client_id: st.current, text: text } };
    this.act('comment', () =>
      apiPost(st.conn, edit ? 'commentUpdate' : 'commentAdd', body)
        .then(() => this.reloadTasks())
        .then(() => this.setState({ commentDraft: '', commentEdit: null })),
      () => {
        const local = { id: edit || 'c-' + Date.now(), client_id: st.current, text: text, created: '', edited: edit ? 'сейчас' : '' };
        this.setState(s => ({
          comments: edit ? s.comments.map(x => (x.id === edit ? local : x)) : s.comments.concat([local]),
          commentDraft: '', commentEdit: null
        }));
      });
  }

  removeComment(id) {
    if (this.state.commentDel !== id) { this.setState({ commentDel: id }); return; }
    this.act('commentDel', () =>
      apiPost(this.state.conn, 'commentDelete', { id: id })
        .then(() => this.reloadTasks())
        .then(() => this.setState({ commentDel: null })),
      () => this.setState(s => ({ comments: s.comments.filter(x => x.id !== id), commentDel: null })));
  }

  copy(text, key, msg) {
    try { navigator.clipboard && navigator.clipboard.writeText(text); } catch (e) {}
    clearTimeout(this._c);
    this.setState({ copied: key });
    this._c = setTimeout(() => this.setState({ copied: null }), 1600);
    if (msg) this.flash(msg);
  }

  btn(kind, extra) {
    const accent = this.props.accent || '#2563eb';
    const base = 'font-size: 12.5px; font-weight: 600; padding: 9px 16px; border-radius: 10px; cursor: pointer; ';
    if (kind === 'primary') return base + 'border: none; background: linear-gradient(135deg,#2563eb,#3b82f6); color: #fff; box-shadow: 0 2px 10px rgba(37,99,235,0.3);' + (extra || '');
    if (kind === 'ghost') return base + 'border: 1px solid #e2e8f0; background: #fff; color: #334155; box-shadow: 0 1px 2px rgba(16,24,40,0.04);' + (extra || '');
    if (kind === 'danger') return base + 'border: none; background: #dc2626; color: #fff; box-shadow: 0 2px 10px rgba(220,38,38,0.28);' + (extra || '');
    return base + 'border: 1px solid #e8edf5; background: #f4f6fa; color: #a8b0bd; cursor: not-allowed;' + (extra || '');
  }

  renderVals() {
    this.bootOnce();

    const st = this.state;
    const conn = st.conn;
    const accent = this.props.accent || '#2563eb';
    const dense = (this.props.density || 'Обычная') === 'Плотная';
    const rowPad = dense ? '9px 16px' : '14px 16px';
    const cs = st.clients;
    const c = this.cur();
    const busy = st.busy;

    /* Индекс открытых задач по клиентам. Считается один раз: его читают
       и точки в списке, и блок в карточке, и вкладка «Все задачи». */
    const openByClient = {};
    st.tasks.forEach(t => {
      if (t.status === 'done') return;
      openByClient[t.client_id] = (openByClient[t.client_id] || 0) + 1;
    });
    const redByClient = {};
    st.tasks.forEach(t => {
      if (t.status === 'done' || t.priority !== 'red') return;
      redByClient[t.client_id] = (redByClient[t.client_id] || 0) + 1;
    });
    const dot = (color, size) => 'display: inline-block; flex: none; width: ' + (size || 7) + 'px; height: ' + (size || 7) + 'px; border-radius: 50%; background: ' + color + ';';
    const clientDot = id => (redByClient[id] ? dot('#d93025', 8) : openByClient[id] ? dot('#e8a33d', 8) : dot('#3f9e6b', 8));
    const clientDotHint = id => (openByClient[id]
      ? 'Открытых задач: ' + openByClient[id] + (redByClient[id] ? ', срочных: ' + redByClient[id] : '')
      : 'Задач нет');

    const payOf = k => PAY[k] || PAY.brief;
    const pillOf = k => PILL + 'background: ' + payOf(k).bg + '; color: ' + payOf(k).fg + '; border: 1px solid ' + payOf(k).bd + ';';
    const slotLabel = c2 => (c2.slots.length ? c2.slots.map(k => (SLOTS.find(s => s.key === k) || { label: k }).label).join(' + ') : '—');

    const q = st.q.trim().toLowerCase();
    const filtered = cs.filter(x => {
      const matchQ = !q || [x.business, x.name, x.city, x.id, x.niche].join(' ').toLowerCase().indexOf(q) >= 0;
      const matchT = st.tariffTab === 'all' || normTariff(x.tariff) === st.tariffTab;
      const f = st.filter;
      const matchF = f === 'Все' ? true
        : f === 'Неактивные' ? !x.active
        : f === 'Оплачено' ? x.pay === 'paid'
        : f === 'Ждут' ? x.pay === 'due' || x.pay === 'brief'
        : x.pay === 'overdue';
      return matchQ && matchF && matchT;
    });

    const rows = filtered.map(x => ({
      dotStyle: clientDot(x.id),
      dotHint: clientDotHint(x.id),
      business: x.business,
      sub: x.name + ' · ' + x.niche + ' · ' + x.city,
      tariff: tariffLabel(x.tariff), slots: slotLabel(x),
      payLabel: payOf(x.pay).label, payStyle: pillOf(x.pay),
      nextPay: fmt(x.nextPay),
      lastPost: x.lastPostStatus.indexOf('Ошибка') === 0 ? '⚠ ' + x.lastPostDate : x.lastPostDate,
      rowStyle: 'display: grid; grid-template-columns: minmax(150px, 2fr) 62px 100px 88px minmax(104px, 1fr) 58px; gap: 10px; min-width: 620px; padding: ' + rowPad + '; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; align-items: center; opacity: ' + (x.active ? 1 : 0.55) + ';',
      toggleStyle: 'width: 34px; height: 19px; border-radius: 10px; border: none; padding: 2px; cursor: pointer; display: flex; justify-content: ' + (x.active ? 'flex-end' : 'flex-start') + '; background: ' + (x.active ? accent : '#cfd0cc') + ';',
      knobStyle: 'display: block; width: 15px; height: 15px; border-radius: 50%; background: #fff;',
      onOpen: () => this.setState({ view: 'card', current: x.id, tab: 'overview' }),
      // переключатель «активен» сохраняется сразу, с откатом при ошибке
      onToggle: e => {
        e.stopPropagation();
        const next = !x.active;
        this.patch(x.id, { active: next });
        this.quietSave(x.id, { active: next }, { active: x.active });
      }
    }));

    /* Вкладки по тарифам. Считаются по всем клиентам, а не по отфильтрованным,
       иначе счётчик прыгал бы при вводе в поиск. Тариф без клиентов всё равно
       показывается — так видно, что раздел существует. */
    const countByTariff = {};
    cs.forEach(x => {
      const id = normTariff(x.tariff);
      countByTariff[id] = (countByTariff[id] || 0) + 1;
    });
    const tariffTabs = [{ key: 'all', label: 'Все', badge: cs.length }].concat(
      tariffIds().map(id => ({ key: id, label: tariffName(id), badge: countByTariff[id] || 0 }))
    ).map(t => {
      const on = st.tariffTab === t.key;
      return {
        label: t.label,
        badge: String(t.badge),
        onClick: () => this.setState({ tariffTab: t.key }),
        style: 'display: inline-flex; align-items: center; gap: 6px; border: none; background: none; cursor: pointer; font-family: inherit; font-size: 12.5px; padding: 7px 11px; margin-bottom: -1px; border-bottom: 2px solid ' +
          (on ? accent + '; font-weight: 600; color: #14171a;' : 'transparent; font-weight: 500; color: #6b7078;'),
        badgeStyle: 'font-family: \'IBM Plex Mono\', monospace; font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 3px; ' +
          (on ? 'background: ' + accent + '; color: #fff;' : 'background: #eeeeea; color: #94a3b8;')
      };
    });

    const filters = ['Все', 'Оплачено', 'Ждут', 'Просрочка', 'Неактивные'].map(f => ({
      label: f,
      onClick: () => this.setState({ filter: f }),
      style: 'border: none; cursor: pointer; font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 4px; ' +
        (st.filter === f ? 'background: rgba(59,130,246,0.15); color: #93c5fd; box-shadow: none;' : 'background: none; color: #334155;')
    }));

    const tabs = [
      { key: 'overview', label: 'Обзор' },
      { key: 'brief', label: 'Бриф' },
      { key: 'content', label: 'Согласование контента' },
      { key: 'payments', label: 'Оплаты' },
      { key: 'comms', label: 'Связь с клиентом' }
    ].map(t => {
      const on = st.tab === t.key;
      return {
        key: t.key, label: t.label,
        isOverview: t.key === 'overview', isBrief: t.key === 'brief',
        isContent: t.key === 'content', isPayments: t.key === 'payments', isComms: t.key === 'comms',
        onClick: () => this.setState({ tab: t.key }),
        iconColor: on ? '#fff' : '#64748b',
        style: 'display: inline-flex; align-items: center; gap: 7px; border: none; cursor: pointer; font-family: inherit; font-size: 12.5px; padding: 8px 14px; border-radius: 9px; white-space: nowrap; ' +
          (on ? 'font-weight: 700; color: #fff; background: #2563eb; box-shadow: 0 3px 10px rgba(37,99,235,0.3);' : 'font-weight: 500; color: #64748b; background: none;')
      };
    });

    const setter = key => e => this.patch(c.id, { [key]: e.target.value, });
    const set = {};
    ['business', 'city', 'about', 'audience', 'tone', 'holidays', 'faq', 'cta', 'limitsText', 'name', 'phone', 'tg', 'email', 'stylePrompt', 'styleSourceText', 'edits', 'tgChannel', 'holidaysExtra', 'postFormat', 'ctaShort', 'photoInstruction'].forEach(k => { set[k] = setter(k); });

    const chip = (on, label, onClick) => ({
      label, onClick,
      style: 'border: 1px solid ' + (on ? accent : '#dedeD9') + '; background: ' + (on ? '#eef1fe' : '#fff') + '; color: ' + (on ? accent : '#5d636b') + '; font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 14px; cursor: pointer;'
    });

    const toggleIn = (key, val) => {
      const arr = c[key].indexOf(val) >= 0 ? c[key].filter(v => v !== val) : c[key].concat([val]);
      this.patch(c.id, { [key]: arr });
    };

    // подбор нишевых праздников по ключевым словам — без вызова AI:
    // заранее проверенный список, только фиксированные даты
    const nicheText = ((c.niche || '') + ' ' + (c.about || '')).toLowerCase();
    const norm = s2 => s2.replace(/\s+/g, ' ').trim();
    const holidayLines = (c.holidaysExtra || '').split('\n').map(norm).filter(Boolean);
    const seenNiche = new Set();
    const nicheSuggestions = [];
    NICHE_HOLIDAY_SUGGESTIONS.forEach(group => {
      if (!group.match.some(k => nicheText.indexOf(k) >= 0)) return;
      group.holidays.forEach(h => {
        const line = norm(h.date + ' ' + h.name);
        if (seenNiche.has(line)) return;
        seenNiche.add(line);
        nicheSuggestions.push({ line, name: h.name });
      });
    });
    const nicheHolidayChips = nicheSuggestions.map(sg => {
      const on = holidayLines.indexOf(sg.line) >= 0;
      return chip(on, sg.name, () => {
        const current = (c.holidaysExtra || '').split('\n').map(norm).filter(Boolean);
        const next = on ? current.filter(l => l !== sg.line) : current.concat([sg.line]);
        this.patch(c.id, { holidaysExtra: next.join('\n') });
      });
    });

    /* ---- смена тарифа --------------------------------------------------
     * Зеркало planTariffChange_ из tariffs.gs. Считаем на фронте, чтобы
     * диалог открывался мгновенно; применяет всё равно сервер, он же
     * и перепроверяет — браузеру верить нельзя.
     * ------------------------------------------------------------------ */
    const LIMIT_META = {
      posts_per_week: { title: 'Постов в неделю', cmp: 'more' },
      slots_per_day: { title: 'Слотов в день', cmp: 'more' },
      rubrics_max: { title: 'Рубрик', cmp: 'more' },
      custom_rubrics_max: { title: 'Своих рубрик', cmp: 'more' },
      holidays_enabled: { title: 'Праздничные посты', cmp: 'bool' },
      holidays_extra: { title: 'Свои праздничные даты', cmp: 'bool' },
      holiday_posts: { title: 'Постов на праздник', cmp: 'more' },
      holiday_promo: { title: 'Промо-серии к праздникам', cmp: 'bool' },
      style_mode: { title: 'Стиль', cmp: 'rank', rank: ['template_brief', 'tov_brief', 'tov_samples', 'tov_tuned'] },
      visual_mode: { title: 'Визуал', cmp: 'rank', rank: ['brand_colors', 'brand_logo', 'niche_photos', 'custom_photos'] },
      content_plan: { title: 'Согласование контент-плана', cmp: 'bool' },
      rubric_edits_per_month: { title: 'Правок рубрик в месяц', cmp: 'more' },
      report: { title: 'Отчёт', cmp: 'rank', rank: ['none', 'pdf', 'pdf_call'] },
      support_sla_hours: { title: 'Ответ поддержки', cmp: 'sla' }
    };
    const limitCmp = (key, a, b) => {
      const m = LIMIT_META[key] || {};
      if (m.cmp === 'more') { const x = Number(a) || 0, y = Number(b) || 0; return y > x ? 1 : (y < x ? -1 : 0); }
      if (m.cmp === 'bool') { const x = !!a, y = !!b; return (y && !x) ? 1 : ((!y && x) ? -1 : 0); }
      if (m.cmp === 'rank') { const i = m.rank.indexOf(a), j = m.rank.indexOf(b); if (i < 0 || j < 0) return 0; return j > i ? 1 : (j < i ? -1 : 0); }
      if (m.cmp === 'sla') { const x = Number(a) === 0 ? -1 : Number(a), y = Number(b) === 0 ? -1 : Number(b); return y < x ? 1 : (y > x ? -1 : 0); }
      return 0;
    };
    const rubricDays = r => String(r.days || '').split(',').map(d2 => d2.trim()).filter(Boolean).length;

    const move = st.tariffMove && st.tariffMove.id === c.id ? st.tariffMove : null;
    const moveTo = move ? move.to : normTariff(c.tariff);
    const limFrom = tariffLimits(c);
    const limTo = tariffLimits(moveTo);

    const moveGains = [], moveLosses = [];
    Object.keys(LIMIT_META).forEach(k => {
      if (limFrom[k] === undefined && limTo[k] === undefined) return;
      const cmp = limitCmp(k, limFrom[k], limTo[k]);
      if (!cmp) return;
      (cmp > 0 ? moveGains : moveLosses).push({
        title: LIMIT_META[k].title,
        from: limitLabel(k, limFrom[k]),
        to: limitLabel(k, limTo[k])
      });
    });

    const allRubrics = c.rubrics || [];
    const liveRubrics = allRubrics.filter(r => !r.dormant);
    const sleeping = allRubrics.filter(r => r.dormant);
    // при повышении спящие возвращаются автоматически, если влезают
    const moveKeep = move ? move.keep : liveRubrics.map(r => r.name);
    const roomR = (limTo.rubrics_max || 0);
    const keptRegular = moveKeep.filter(n => {
      const r = allRubrics.find(x => x.name === n);
      return r && !r.custom;
    });
    const keptCustom = moveKeep.filter(n => {
      const r = allRubrics.find(x => x.name === n);
      return r && r.custom;
    });

    const moveSlots = move && move.keepSlots ? move.keepSlots : (c.slots || []);
    const maxSlotsTo = limTo.slots_per_day || 1;
    let weekTo = 0;
    moveKeep.forEach(n => { const r = allRubrics.find(x => x.name === n); if (r) weekTo += rubricDays(r); });

    const moveConflicts = [];
    if (keptRegular.length > roomR) moveConflicts.push('Оставлено рубрик ' + keptRegular.length + ', тариф даёт ' + roomR);
    if (keptCustom.length > (limTo.custom_rubrics_max || 0)) moveConflicts.push('Оставлено своих рубрик ' + keptCustom.length + ', тариф даёт ' + (limTo.custom_rubrics_max || 0));
    if (moveSlots.length > maxSlotsTo) moveConflicts.push('Выбрано слотов ' + moveSlots.length + ', тариф даёт ' + maxSlotsTo);
    if (weekTo > (limTo.posts_per_week || 0)) moveConflicts.push('Постов в неделю ' + weekTo + ', тариф даёт ' + (limTo.posts_per_week || 0));

    const doneCount = CHECKS.filter(k => c.checks[k.key]).length;
    const styleFilled = c.styleAnswers.filter(a => a.trim()).length;
    const lim = tariffLimits(c);
    const maxSlots = lim.slots_per_day || 1;

    /* ---- вкладка «Оплаты» ------------------------------------------
     * Черновик живёт в state.payDraft и в таблицу ничего не пишет.
     * Пишет только «Сохранить» -> action=set_payment.
     * Инвариант тот же, что в Apps Script: nextPay = paidAt + months,
     * поэтому повторное сохранение не сдвигает дату.
     * ---------------------------------------------------------------- */
    const payDraft = st.payDraft && st.payDraft.id === c.id ? st.payDraft : null;
    const payFrom = payDraft ? payDraft.paidAt : isoDate(c.paidAt || c.nextPay || TODAY);
    const payMonths = payDraft ? payDraft.months : (c.payMonths || 1);
    const payFromDate = parseDate(payFrom);
    const payToDate = payFromDate ? addMonths(payFromDate, payMonths) : null;
    const payNeedsSave = !!payDraft || !c.paidAt || (c.payMonths || 0) !== payMonths;
    const payCancelArmed = st.payCancelArm === c.id;
    const setPayDraft = ch => this.setState({
      payDraft: Object.assign({ id: c.id, paidAt: payFrom, months: payMonths }, ch),
      payCancelArm: null
    });

    const reminders = c.nextPay ? [
      { label: 'За 3 дня', date: fmt(shift(c.nextPay, -3)) },
      { label: 'За 1 день', date: fmt(shift(c.nextPay, -1)) },
      { label: 'В день оплаты', date: fmt(c.nextPay) },
      { label: 'При просрочке — ежедневно', date: 'с ' + fmt(shift(c.nextPay, 1)) }
    ] : [{ label: 'Оплата не назначена — бриф не обработан', date: '—' }];

    const dep = st.deployed[c.id] || (c.configPushed ? { sha: String(c.configPushed).split(' · ')[0], prevSha: '—', at: String(c.configPushed).split(' · ')[1] || '' } : null);
    // тот же конфиг, что соберёт Web App перед коммитом в GitHub
    const cfg = JSON.stringify({
      client_id: c.id,
      business: c.business,
      city: c.city,
      tariff: c.tariff,
      networks: c.networks.map(n => n.toLowerCase()),
      slots: c.slots.map(k => ({ name: k, cron: (SLOTS.find(s => s.key === k) || { times: '' }).times.split(' ')[0] })),
      style_prompt: c.stylePrompt || null,
      tone: c.tone,
      holidays: c.holidays,
      forbidden: c.limits.concat(c.limitsText ? [c.limitsText] : []),
      cta: c.cta,
      faq: c.faq ? c.faq.split('\n') : [],
      rubrics: c.rubrics.map(r => ({ name: r.name, caption: r.caption || '', days: r.days.split(',').map(d2 => d2.trim()), kind: r.kind || '', topics: r.topics || [], prompt: r.prompt, manual: !!r.manual })),
      tg_channel: c.tgChannel || null,
      morning_photo: !!c.morningPhoto,
      holidays_extra: c.holidaysExtra || '',
      post_format: c.postFormat || null,
      yandex_folder: YANDEX_ROOT + c.id,
      active: c.active !== false,
      iterations: c.iterations
    }, null, 2);
    const cfgBytes = new Blob([cfg]).size;

    /* ============================ ЗАДАЧИ И КОММЕНТАРИИ ============== */

    const nameById = {};
    cs.forEach(x => { nameById[x.id] = x.business || x.name || x.id; });

    const openAll = st.tasks.filter(t => t.status !== 'done');
    const overdueAll = openAll.filter(t => {
      const end = taskEnd(t);
      return end && end.getTime() < TODAY.getTime();
    });
    const taskNavBadge = overdueAll.length ? String(overdueAll.length)
      : openAll.length ? String(openAll.length) : '';
    const taskNavTone = overdueAll.length ? 'red' : 'amber';

    const priDot = p => dot(TASK_COLORS[p] || TASK_COLORS.blue, 7);
    const boxOf = done => 'flex: none; width: 15px; height: 15px; margin-top: 1px; border-radius: 3px; cursor: pointer; padding: 0; display: grid; place-items: center; border: 1px solid ' +
      (done ? accent + '; background: ' + accent + ';' : '#cfd0cc; background: #fff;');
    const markOf = done => 'font-size: 10px; line-height: 1; color: #fff; visibility: ' + (done ? 'visible' : 'hidden') + ';';
    const titleBtn = done => 'flex: 1; min-width: 0; border: none; background: none; padding: 0; cursor: pointer; font-family: inherit; font-size: 12.5px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #14171a;' +
      (done ? ' text-decoration: line-through;' : '');
    const whenStyle = t => {
      const end = taskEnd(t);
      const late = end && end.getTime() < TODAY.getTime() && t.status !== 'done';
      return "font-family: 'IBM Plex Mono', monospace; font-size: 11px; flex: none; padding-top: 1px; color: " + (late ? '#b3261e' : '#8a8f96') + ';';
    };
    const taskRow = t => ({
      title: t.title,
      when: taskWhen(t) || 'без срока',
      whenStyle: whenStyle(t),
      dotStyle: priDot(t.priority),
      boxStyle: boxOf(t.status === 'done'),
      markStyle: markOf(t.status === 'done'),
      titleStyle: titleBtn(t.status === 'done'),
      onOpen: () => this.openTask(t, t.client_id),
      onDone: () => this.toggleTask(t)
    });

    // ---- блок в карточке
    const mine = st.tasks.filter(t => t.client_id === c.id);
    const mineOpen = mine.filter(t => t.status !== 'done');
    const mineDone = mine.filter(t => t.status === 'done');
    const byDate = (a, b) => {
      const ea = taskEnd(a), eb = taskEnd(b);
      if (!ea && !eb) return 0;
      if (!ea) return 1;
      if (!eb) return -1;
      return ea - eb;
    };
    mineOpen.sort(byDate);

    const myComments = st.comments.filter(m => m.client_id === c.id).slice().reverse();

    // ---- вкладка «Все задачи»
    const weekEnd = (function () {
      const n = new Date(TODAY);
      const shiftDays = (7 - (n.getDay() || 7));   // до ближайшего воскресенья
      n.setDate(n.getDate() + shiftDays);
      return n;
    })();

    const visible = st.tasks.filter(t => {
      if (t.status === 'done' && !st.tasksShowDone) return false;
      if (st.taskFilter !== 'all' && t.priority !== st.taskFilter) return false;
      return true;
    });

    const bucket = t => {
      const end = taskEnd(t);
      if (!end) return 'none';
      if (t.status !== 'done' && end.getTime() < TODAY.getTime()) return 'over';
      const from = parseDate(t.date_from) || end;
      if (from.getTime() <= TODAY.getTime() && end.getTime() >= TODAY.getTime()) return 'today';
      if (end.getTime() <= weekEnd.getTime()) return 'week';
      return 'later';
    };

    const GROUPS = [
      { key: 'over', title: 'Просрочено', color: '#b3261e' },
      { key: 'today', title: 'Сегодня', color: '#14171a' },
      { key: 'week', title: 'На этой неделе', color: '#14171a' },
      { key: 'later', title: 'Позже', color: '#6b7078' },
      { key: 'none', title: 'Без срока', color: '#6b7078' }
    ];
    const grouped = {};
    visible.forEach(t => { (grouped[bucket(t)] = grouped[bucket(t)] || []).push(t); });

    const taskGroups = GROUPS.filter(g => (grouped[g.key] || []).length).map(g => {
      const list = (grouped[g.key] || []).slice().sort(byDate);
      return {
        title: g.title,
        count: String(list.length),
        headStyle: 'display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid #e8edf5; background: #f8fafc; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: ' + g.color + ';',
        badgeStyle: "font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 20px; background: #e2e8f0; color: #64748b;",
        rows: list.map(t => Object.assign(taskRow(t), {
          client: nameById[t.client_id] || t.client_id,
          rowStyle: 'display: flex; align-items: flex-start; gap: 9px; padding: 8px 14px; border-bottom: 1px solid #f2f2ee;' + (t.status === 'done' ? ' opacity: 0.55;' : ''),
          onClient: () => this.setState({ view: 'card', current: t.client_id, tab: 'overview' })
        }))
      };
    });

    // ---- модалка
    const tm = st.taskModal;
    const modeTabBtn = (key, label) => ({
      label: label,
      onClick: () => this.patchModal({ mode: key }),
      style: 'border: none; background: none; cursor: pointer; font-family: inherit; font-size: 12.5px; padding: 7px 11px; margin-bottom: -1px; border-bottom: 2px solid ' +
        (tm && tm.mode === key ? accent + '; font-weight: 600; color: #14171a;' : 'transparent; font-weight: 500; color: #6b7078;')
    });
    const priBtn = on => 'display: inline-flex; align-items: center; gap: 7px; border: 1px solid ' + (on ? accent : '#dedeD9') +
      '; background: ' + (on ? '#eef1fe' : '#fff') + '; color: ' + (on ? '#14171a' : '#5d636b') +
      '; font-family: inherit; font-size: 12.5px; font-weight: 500; padding: 7px 13px; border-radius: 16px; cursor: pointer;';
    const fmtBtn = "border: 1px solid #dedeD9; background: #fff; width: 28px; height: 26px; border-radius: 4px; cursor: pointer; font-size: 12.5px; padding: 0;";
    const fontIdx = tm ? TASK_FONTS.indexOf(tm.font) : 0;
    const stepBtn = enabled => fmtBtn + ' width: 32px;' + (enabled ? '' : ' color: #c9ccd0; cursor: default;');
    const exec = cmd => e => {
      e.preventDefault();               // не даём полю потерять выделение
      const el = document.getElementById('dc-task-desc');
      if (el) { el.focus(); document.execCommand(cmd, false, null); }
    };

    return {
      // ---- точки, навигация
      isTasks: st.view === 'tasks',

      // ---- блок задач в карточке
      blkTasksOpen: st.blkTasks,
      blkTasksCaret: st.blkTasks ? '▾' : '▸',
      toggleBlkTasks: () => this.setState({ blkTasks: !st.blkTasks }),
      openTaskCount: mineOpen.length ? String(mineOpen.length) : '',
      openTaskCountStyle: mineOpen.length
        ? "font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 3px; background: " +
          (mineOpen.some(t => t.priority === 'red') ? '#fbe9e7; color: #a91f18;' : '#eeeeea; color: #94a3b8;')
        : 'display: none;',
      openNewTask: () => this.openTask(null, c.id),
      cardTasks: mineOpen.map(taskRow),
      cardTasksEmpty: mineOpen.length === 0,
      hasDoneTasks: mineDone.length > 0,
      showDoneLabel: (st.showDone ? 'Скрыть выполненные (' : 'Показать выполненные (') + mineDone.length + ')',
      toggleShowDone: () => this.setState({ showDone: !st.showDone }),
      cardTasksDone: st.showDone ? mineDone.map(taskRow) : [],

      // ---- блок комментариев
      blkCommentsOpen: st.blkComments,
      blkCommentsCaret: st.blkComments ? '▾' : '▸',
      toggleBlkComments: () => this.setState({ blkComments: !st.blkComments }),
      commentCount: myComments.length ? String(myComments.length) : '',
      commentCountStyle: myComments.length
        ? "font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 20px; background: #e2e8f0; color: #64748b;"
        : 'display: none;',
      commentDraft: st.commentDraft,
      commentPlaceholder: st.commentEdit ? 'Правка комментария' : 'Комментарий по клиенту',
      setCommentDraft: e => this.setState({ commentDraft: e.target.value }),
      submitComment: () => this.submitComment(),
      commentEditing: !!st.commentEdit,
      cancelCommentEdit: () => this.setState({ commentEdit: null, commentDraft: '' }),
      commentBtnLabel: busy === 'comment' ? '…' : st.commentEdit ? 'Сохранить' : 'Добавить',
      commentBtnStyle: this.btn(String(st.commentDraft || '').trim() ? 'primary' : 'muted', ' flex: none;'),
      cardComments: myComments.map(m => ({
        text: m.text,
        meta: m.created + (m.edited ? ' · правлен ' + m.edited : ''),
        onEdit: () => this.setState({ commentEdit: m.id, commentDraft: m.text, commentDel: null }),
        onDelete: () => this.removeComment(m.id),
        delLabel: st.commentDel === m.id ? 'точно?' : '✕',
        delStyle: 'border: none; background: none; padding: 0 2px; cursor: pointer; font-size: ' +
          (st.commentDel === m.id ? '11px; color: #a91f18; font-weight: 600;' : '12px; color: #94a3b8;')
      })),
      cardCommentsEmpty: myComments.length === 0,

      // ---- вкладка «Все задачи»
      taskGroups: taskGroups,
      taskGroupsEmpty: taskGroups.length === 0,
      taskShown: String(visible.length),
      taskTotal: String(st.tasks.length),
      taskFilters: [
        { key: 'all', label: 'Все' },
        { key: 'red', label: 'Срочные' },
        { key: 'blue', label: 'Обычные' }
      ].map(f => ({
        label: f.label,
        onClick: () => this.setState({ taskFilter: f.key }),
        style: 'border: none; cursor: pointer; font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 4px; ' +
          (st.taskFilter === f.key ? 'background: rgba(59,130,246,0.15); color: #93c5fd; box-shadow: none;' : 'background: none; color: #334155;')
      })),
      allDoneLabel: st.tasksShowDone ? 'Скрыть выполненные' : 'Показать выполненные',
      allDoneStyle: 'border: 1px solid ' + (st.tasksShowDone ? accent : '#d9d9d4') + '; background: #fff; color: ' +
        (st.tasksShowDone ? accent : '#5d636b') + '; font-family: inherit; font-size: 12px; font-weight: 500; padding: 6px 11px; border-radius: 5px; cursor: pointer;',
      toggleAllDone: () => this.setState({ tasksShowDone: !st.tasksShowDone }),

      // ---- модалка задачи
      taskModalOpen: !!tm,
      taskModalTitle: tm && tm.id ? 'Правка задачи' : 'Новая задача',
      closeTaskModal: () => this.setState({ taskModal: null }),
      onBackdropClick: () => this.setState({ taskModal: null }),
      stopClick: e => e.stopPropagation(),
      taskTitle: tm ? tm.title : '',
      setTaskTitle: e => this.patchModal({ title: e.target.value }),
      taskDescStyle: 'min-height: 108px; margin-top: 10px; padding: 9px 10px; border: 1px solid #dedeD9; border-radius: 4px; background: #fff; line-height: 1.55; overflow-y: auto; max-height: 280px; font-size: ' +
        (tm && TASK_FONTS.indexOf(tm.font) >= 0 ? tm.font : 14) + 'px;',
      fmtBtnStyle: fmtBtn,
      fmtBold: exec('bold'),
      fmtItalic: exec('italic'),
      fmtUnderline: exec('underline'),
      taskFontLabel: (tm && TASK_FONTS.indexOf(tm.font) >= 0 ? tm.font : 14) + 'px',
      fontDownStyle: stepBtn(fontIdx > 0),
      fontUpStyle: stepBtn(fontIdx >= 0 && fontIdx < TASK_FONTS.length - 1),
      fontDown: () => { if (fontIdx > 0) this.patchModal({ font: TASK_FONTS[fontIdx - 1] }); },
      fontUp: () => { if (fontIdx >= 0 && fontIdx < TASK_FONTS.length - 1) this.patchModal({ font: TASK_FONTS[fontIdx + 1] }); },
      priRedStyle: priBtn(!!tm && tm.priority === 'red'),
      priBlueStyle: priBtn(!!tm && tm.priority === 'blue'),
      setPriRed: () => this.patchModal({ priority: 'red' }),
      setPriBlue: () => this.patchModal({ priority: 'blue' }),
      taskModeTabs: [modeTabBtn('date', 'Дата'), modeTabBtn('range', 'Период'), modeTabBtn('none', 'Без срока')],
      taskModeDate: !!tm && tm.mode === 'date',
      taskModeRange: !!tm && tm.mode === 'range',
      taskModeNone: !!tm && tm.mode === 'none',
      taskFrom: tm ? tm.from : '',
      taskTo: tm ? tm.to : '',
      setTaskFrom: e => this.patchModal({ from: e.target.value }),
      setTaskTo: e => this.patchModal({ to: e.target.value }),
      saveTaskLabel: busy === 'task' ? 'Сохраняю…' : 'Сохранить',
      saveTaskStyle: this.btn(tm && String(tm.title || '').trim() ? 'primary' : 'muted', ' width: 100%; margin-top: 18px; padding: 10px;'),
      saveTask: () => this.saveTask(),
      taskCanDelete: !!(tm && tm.id),
      deleteTaskLabel: busy === 'taskDel' ? 'Удаляю…' : 'Удалить задачу',
      deleteTaskStyle: 'width: 100%; margin-top: 8px; border: none; background: none; font-family: inherit; font-size: 12px; color: #a91f18; padding: 7px; cursor: pointer;',
      deleteTask: () => this.removeTask(),

      syncedAt: st.demo ? 'демо-данные' : st.loading ? 'загрузка…' : st.syncAt,
      isList: st.view === 'list', isCard: st.view === 'card',
      isPayments: st.view === 'payments', isBriefs: st.view === 'briefs',
      isLog: st.view === 'log', isSettings: st.view === 'settings',
      navItems: (() => {
        const defs = [
          { key: 'list', label: 'Клиенты', badge: String(cs.length), tone: 'plain' },
          { key: 'payments', label: 'Оплаты', badge: cs.filter(x => x.pay === 'overdue').length ? String(cs.filter(x => x.pay === 'overdue').length) : '', tone: 'red' },
          { key: 'briefs', label: 'Брифы', badge: st.briefs.length ? String(st.briefs.length) : '', tone: 'amber' },
          { key: 'tasks', label: 'Все задачи', badge: taskNavBadge, tone: taskNavTone },
          { key: 'log', label: 'Лог публикаций', badge: '', tone: 'plain' },
          { key: 'settings', label: 'Настройки', badge: st.demo || !conn.WEBAPP_URL ? '!' : '', tone: 'red' }
        ];
        const tones = {
          plain: 'background: rgba(255,255,255,0.22); color: rgba(255,255,255,0.85);',
          amber: 'background: rgba(255,255,255,0.9); color: #b45309;',
          red: 'background: rgba(255,255,255,0.95); color: #dc2626;'
        };
        return defs.map(n => {
          const on = st.view === n.key || (n.key === 'list' && st.view === 'card');
          return {
            key: n.key, label: n.label, badge: n.badge,
            isList: n.key === 'list', isPayments: n.key === 'payments', isBriefs: n.key === 'briefs',
            isTasks: n.key === 'tasks', isLog: n.key === 'log', isSettings: n.key === 'settings',
            // повторный клик по текущему разделу — перезагрузка данных из таблицы
            onClick: () => {
              if (st.view === n.key && n.key !== 'settings') { this.boot(true); this.flash('Обновляю из таблицы…'); }

          }),
          () => {
            this.patch(c.id, { pay: 'due', payMonths: 0, nextPay: c.paidAt || was });
            this.setState({ payDraft: null, payCancelArm: null });
            this.flash('Демо: отмена не записана в таблицу');
          });
      },

      /* ---- вкладка «Связь с клиентом» ---- */
      letter1Text: c.letterSetup || '',
      letter1Empty: !c.letterSetup,
      letter1HasText: !!c.letterSetup,
      letter1Label: busy === 'letter1' ? 'Генерирую…' : c.letterSetup ? 'Перегенерировать' : 'Собрать письмо',
      letter1BtnStyle: busy ? this.btn('off') : this.btn('ghost'),
      onLetter1: () => this.act('letter1',
        () => apiPost(conn, 'letter_setup', { id: c.id }).then(r => {
          this.applyClient(r.client);
          this.flash('Письмо 1 собрано' + (r.gaps && r.gaps.length ? ' · пробелов в брифе: ' + r.gaps.length : ' · бриф заполнен полно'));
        }),
        () => {
          this.patch(c.id, { letterSetup: '[Демо] Здравствуйте, ' + (c.name.split(' ')[0] || '') + '! Письмо сгенерировано в демо-режиме.' });
          this.flash('Демо: письмо не записано в таблицу');
        }),
      onSetLetter1: e => this.patch(c.id, { letterSetup: e.target.value }),
      onCopyLetter1: () => this.copy(c.letterSetup || '', 'l1', 'Письмо 1 скопировано'),
      copyLetter1Label: st.copied === 'l1' ? 'Скопировано ✓' : 'Копировать',

      letter2DiskLink: c.diskLink || '',
      letter2FirstDate: c.firstPostDate ? isoDate(c.firstPostDate) : '',
      onLetter2DiskLink: e => this.patch(c.id, { diskLink: e.target.value }),
      onLetter2FirstDate: e => {
        const d = parseDate(e.target.value);
        this.patch(c.id, { firstPostDate: d });
      },
      letter2Text: c.letterLaunch || '',
      letter2Empty: !c.letterLaunch,
      letter2HasText: !!c.letterLaunch,
      letter2Label: busy === 'letter2' ? 'Генерирую…' : c.letterLaunch ? 'Перегенерировать' : 'Собрать письмо о запуске',
      letter2BtnStyle: busy ? this.btn('off') : this.btn('primary'),
      onLetter2: () => {
        const diskLink = c.diskLink || '';
        const firstPostDate = c.firstPostDate ? isoDate(c.firstPostDate) : '';
        this.act('letter2',
          () => apiPost(conn, 'letter_launch', { id: c.id, diskLink, firstPostDate }).then(r => {
            this.applyClient(r.client);
            this.flash('Письмо 2 собрано');
          }),
          () => {
            this.patch(c.id, { letterLaunch: '[Демо] ' + c.business + ', автопостинг настроен! Это демо-режим.' });
            this.flash('Демо: письмо не записано в таблицу');
          });
      },
      onSetLetter2: e => this.patch(c.id, { letterLaunch: e.target.value }),
      onCopyLetter2: () => this.copy(c.letterLaunch || '', 'l2', 'Письмо 2 скопировано'),
      copyLetter2Label: st.copied === 'l2' ? 'Скопировано ✓' : 'Копировать',

      openRow: function() {
        if (!c.rowUrl) return this.flash(st.demo
          ? 'Демо-режим: задайте WEBAPP_URL, чтобы открыть строку в таблице'
          : 'Для этого клиента нет ссылки на строку — обновите список');
        try { window.open(c.rowUrl, '_blank'); } catch (e) { this.flash('Не удалось открыть таблицу'); }
      }.bind(this),
      reminders,
      hasToast: !!st.toast, toast: st.toast
    };
  }
}

mountPage(
  document.getElementById('crm-template').content,
  Component,
  {
  "density": "Обычная",
  "showStats": true,
  "accent": "#2b4acf"
},
  document.getElementById('crm-root')
);
</script>

</body>
</html>
