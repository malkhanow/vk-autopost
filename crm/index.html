<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMM-сервис · CRM</title>
<!--
  Файл собран из «Клиенты.dc.html» скриптом crm/build_page.py — руками не правьте.
  Меняйте холст и пересобирайте:  python3 crm/build_page.py
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; background: #eef2f9; color: #334155; -webkit-font-smoothing: antialiased; }
  a { color: #2563eb; text-decoration: none; }
  a:hover { color: #1d4ed8; text-decoration: none; }
  input, textarea, button, select { font-family: inherit; font-size: inherit; color: inherit; }
  input:not([type=checkbox]):not([type=radio]):not([type=file]),
  textarea, select {
    background: #fff !important;
    color: #0f172a !important;
    border: 1px solid #e2e8f0 !important;
    border-radius: 10px !important;
    padding: 9px 12px !important;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04) !important;
  }
  input:focus, textarea:focus, select:focus {
    outline: none !important;
    border-color: #2563eb !important;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12) !important;
  }
  select option { background: #fff; color: #0f172a; }
  *::placeholder { color: #94a3b8 !important; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  [contenteditable][data-placeholder]:empty:before { content: attr(data-placeholder); color: #94a3b8; }
  [contenteditable]:focus { outline: 2px solid rgba(37,99,235,0.35); outline-offset: -1px; }
  button { transition: background 0.14s, border-color 0.14s, color 0.14s, box-shadow 0.14s, transform 0.14s; }
  section {
    background: #fff !important;
    border: 1px solid #e8edf5 !important;
    border-radius: 16px !important;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 10px 28px rgba(16,24,40,0.05) !important;
  }
  h2 { color: #0f172a !important; font-size: 13.5px !important; letter-spacing: -0.01em !important; text-transform: none !important; font-weight: 700 !important; }
  section > h2:first-child { padding-left: 0 !important; border-left: none !important; margin-bottom: 14px !important; }
  pre { background: #f7f9fc !important; border: 1px solid #e8edf5 !important; color: #475569 !important; border-radius: 12px !important; }
  input[type=checkbox] { accent-color: #2563eb; }
  main > div { color: #334155; }
  select.sel-auto { background: #eff6ff !important; color: #2563eb !important; border-color: #2563eb !important; font-weight: 700 !important; }
  select.sel-manual { background: #fff !important; color: #64748b !important; border-color: #e2e8f0 !important; }
  @keyframes avatarSpin { to { transform: rotate(360deg); } }
  .avatar-wrap:hover .avatar-hover-overlay { opacity: 1 !important; }
  .avatar-wrap:hover .avatar-initials { opacity: 0.3; }
</style>
</head>
<body>

<div id="crm-root"></div>

<template id="crm-template">
<div style="display: flex; height: 100vh; overflow: hidden; background: #eef2f9">

  <nav style="box-sizing: border-box; width: 248px; flex: none; height: 100%; background: linear-gradient(165deg,#1e3a8a 0%,#1d4ed8 55%,#2563eb 100%); padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; overflow-x: hidden; position: relative; z-index: 2">
      <div style="display: flex; align-items: center; gap: 10px; padding: 0 6px 14px; flex: none">
        <div style="width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.28); display: grid; place-items: center; font-weight: 800; font-size: 15px; color: #fff; flex: none">S</div>
        <div style="min-width: 0">
          <div style="font-weight: 800; font-size: 14px; letter-spacing: -0.02em; color: #fff; line-height: 1.2; white-space: nowrap">SMM-сервис</div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: rgba(255,255,255,0.65); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; margin-top: 2px">CRM</div>
        </div>
      </div>

      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="6">
        <button onClick="{{ n.onClick }}" style="{{ n.style }}">
          <span style="display: flex; align-items: center; gap: 10px">
            <sc-if value="{{ n.isList }}" hint-placeholder-val="{{ false }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ n.iconColor }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            </sc-if>
            <sc-if value="{{ n.isPayments }}" hint-placeholder-val="{{ false }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ n.iconColor }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            </sc-if>
            <sc-if value="{{ n.isBriefs }}" hint-placeholder-val="{{ false }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ n.iconColor }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            </sc-if>
            <sc-if value="{{ n.isTasks }}" hint-placeholder-val="{{ false }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ n.iconColor }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
            </sc-if>
            <sc-if value="{{ n.isLog }}" hint-placeholder-val="{{ false }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ n.iconColor }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            </sc-if>
            <sc-if value="{{ n.isSettings }}" hint-placeholder-val="{{ false }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{ n.iconColor }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </sc-if>
            {{ n.label }}
          </span>
          <span style="{{ n.badgeStyle }}">{{ n.badge }}</span>
        </button>
      </sc-for>

      <div style="flex: 1; min-height: 8px"></div>

      <div style="border-top: 1px solid rgba(255,255,255,0.18); padding: 8px 6px 0; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; line-height: 1.6; color: rgba(255,255,255,0.6); flex: none">
        <div>Apps Script Web App</div>
        <div>монорепо: vk-autopost</div>
      </div>
  </nav>

  <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">

    <header style="display: flex; flex-direction: column; flex: none; background: #fff; border-bottom: 1px solid #e8edf5; box-shadow: 0 1px 2px rgba(16,24,40,0.03); z-index: 5">
      <div style="display: flex; align-items: center; gap: 18px; height: 60px; padding: 0 24px">
        <div style="flex: 1 1 200px; min-width: 0; max-width: 420px; display: flex; align-items: center; gap: 8px; background: #f4f6fa; border: 1px solid #e8edf5; border-radius: 10px; padding: 8px 12px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span style="font-size: 12.5px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">Поиск по клиентам, задачам, комментариям…</span>
        </div>
        <div style="flex: 1"></div>
        <div style="display: flex; align-items: center; gap: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #94a3b8; flex: none; white-space: nowrap">
          <span>Синхронизация: <span style="color: #475569; font-weight: 500">{{ syncedAt }}</span></span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; cursor: pointer">
          <div style="width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,#2563eb,#7c5cf6); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; box-shadow: 0 2px 8px rgba(37,99,235,0.35); flex: none">ВМ</div>
          <span style="font-size: 13px; font-weight: 600; color: #0f172a">Владимир</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>

      <sc-if value="{{ isCard }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 24px; flex-wrap: wrap; row-gap: 8px; border-top: 1px solid #f1f5f9">
          <div style="display: flex; gap: 4px; background: #f4f6fa; border: 1px solid #eef2f7; border-radius: 11px; padding: 4px; flex: none; overflow-x: auto; max-width: 100%">
            <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
              <button onClick="{{ t.onClick }}" style="{{ t.style }}">
                <sc-if value="{{ t.isOverview }}" hint-placeholder-val="{{ false }}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ t.iconColor }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                </sc-if>
                <sc-if value="{{ t.isBrief }}" hint-placeholder-val="{{ false }}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ t.iconColor }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                </sc-if>
                <sc-if value="{{ t.isContent }}" hint-placeholder-val="{{ false }}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ t.iconColor }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                </sc-if>
                <sc-if value="{{ t.isPayments }}" hint-placeholder-val="{{ false }}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ t.iconColor }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                </sc-if>
                <sc-if value="{{ t.isComms }}" hint-placeholder-val="{{ false }}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ t.iconColor }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                </sc-if>
                {{ t.label }}
              </button>
            </sc-for>
          </div>
          <div style="flex: 1"></div>
          <button onClick="{{ back }}" style="border: none; background: none; padding: 0; font-size: 12.5px; color: #2563eb; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-weight: 600; white-space: nowrap; flex: none" style-hover="color: #1d4ed8">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            К списку клиентов
          </button>
        </div>
      </sc-if>
    </header>

    <main style="flex: 1; min-width: 0; overflow-y: auto">

      <sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
        <div style="padding: 24px 26px 48px; max-width: 1240px">

          <div style="display: flex; align-items: flex-end; gap: 16px; margin-bottom: 16px">
            <div>
              <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.035em; color: #0f172a">Клиенты</h1>
              <p style="margin: 4px 0 0; font-size: 13px; color: #64748b">Подписки, оплаты и статус ведения. Клик по строке — карточка клиента.</p>
            </div>
            <div style="flex: 1"></div>
            <button onClick="{{ openNew }}" style="border: none; background: linear-gradient(135deg,#2563eb,#3b82f6); color: #fff; font-size: 12.5px; font-weight: 600; padding: 10px 18px; border-radius: 10px; cursor: pointer; white-space: nowrap; box-shadow: 0 2px 12px rgba(37,99,235,0.32)" style-hover="box-shadow: 0 4px 18px rgba(37,99,235,0.45)">Новый клиент вручную</button>
          </div>

          <sc-if value="{{ showStats }}" hint-placeholder-val="{{ true }}">
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px">
              <div style="background: #fff; border: 1px solid #e8edf5; border-radius: 16px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 10px 28px rgba(16,24,40,0.05); position: relative; overflow: hidden">
                <div style="font-size: 11px; letter-spacing: 0.02em; color: #64748b; font-weight: 600">Активных</div>
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 700; margin-top: 6px; letter-spacing: -0.03em; color: #0f172a">{{ statActive }}</div>
              </div>
              <div style="background: #fff; border: 1px solid #e8edf5; border-radius: 16px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 10px 28px rgba(16,24,40,0.05); position: relative; overflow: hidden">
                <div style="font-size: 11px; letter-spacing: 0.02em; color: #64748b; font-weight: 600">MRR</div>
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 700; margin-top: 6px; letter-spacing: -0.03em; color: #0f172a">{{ statMrr }}</div>
              </div>
              <div style="background: #fff; border: 1px solid #e8edf5; border-radius: 16px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 10px 28px rgba(16,24,40,0.05); position: relative; overflow: hidden">
                <div style="font-size: 11px; letter-spacing: 0.02em; color: #64748b; font-weight: 600">Ждут оплаты</div>
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 700; margin-top: 6px; letter-spacing: -0.03em; color: #b45309">{{ statDue }}</div>
              </div>
              <div style="background: #fff; border: 1px solid #e8edf5; border-radius: 16px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 10px 28px rgba(16,24,40,0.05); position: relative; overflow: hidden">
                <div style="font-size: 11px; letter-spacing: 0.02em; color: #64748b; font-weight: 600">Просрочка</div>
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 700; margin-top: 6px; letter-spacing: -0.03em; color: #dc2626">{{ statOverdue }}</div>
              </div>
            </div>
          </sc-if>

          <div style="display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid #e8edf5; margin-bottom: 14px">
            <sc-for list="{{ tariffTabs }}" as="tt" hint-placeholder-count="6">
              <button onClick="{{ tt.onClick }}" style="{{ tt.style }}">
                <span>{{ tt.label }}</span>
                <span style="{{ tt.badgeStyle }}">{{ tt.badge }}</span>
              </button>
            </sc-for>
          </div>

          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px">
            <input type="text" placeholder="Поиск: имя, бизнес, город, client_id" value="{{ q }}" onChange="{{ onSearch }}" style="width: 320px; font-size: 12.5px">
            <div style="display: flex; gap: 4px; background: #fff; border: 1px solid #e8edf5; padding: 4px; border-radius: 12px; box-shadow: 0 1px 2px rgba(16,24,40,0.04)">
              <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
                <button onClick="{{ f.onClick }}" style="{{ f.style }}">{{ f.label }}</button>
              </sc-for>
            </div>
            <div style="flex: 1"></div>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #94a3b8; white-space: nowrap">{{ shownCount }} из {{ totalCount }}</span>
          </div>

          <div style="background: #fff; border: 1px solid #e8edf5; border-radius: 16px; overflow-x: auto; box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 10px 28px rgba(16,24,40,0.05)">
            <div style="display: grid; grid-template-columns: minmax(150px, 2fr) 62px 100px 88px minmax(104px, 1fr) 58px; gap: 10px; min-width: 620px; padding: 10px 16px; border-bottom: 1px solid #eef2f7; background: #f9fbfe; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #64748b">
              <div>Клиент</div>
              <div>Тариф</div>
              <div>Оплата</div>
              <div>Платёж</div>
              <div>Последний пост</div>
              <div style="text-align: right">Вкл.</div>
            </div>
            <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
              <div onClick="{{ r.onOpen }}" style="{{ r.rowStyle }}" style-hover="background: #f7faff">
                <div style="min-width: 0">
                  <div style="display: flex; align-items: center; gap: 6px; min-width: 0">
                    <span style="{{ r.dotStyle }}" title="{{ r.dotHint }}"></span>
                    <span style="font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.business }}</span>
                  </div>
                  <div style="font-size: 11.5px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px">{{ r.sub }}</div>
                </div>
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 500; padding-top: 2px">{{ r.tariff }}</div>
                <div style="padding-top: 1px"><span style="{{ r.payStyle }}">{{ r.payLabel }}</span></div>
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding-top: 3px">{{ r.nextPay }}</div>
                <div style="min-width: 0; padding-top: 3px">
                  <div style="font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.lastPost }}</div>
                  <div style="font-size: 11px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px">{{ r.slots }}</div>
                </div>
                <div style="display: flex; justify-content: flex-end; padding-top: 1px">
                  <button onClick="{{ r.onToggle }}" style="{{ r.toggleStyle }}"><span style="{{ r.knobStyle }}"></span></button>
                </div>
              </div>
            </sc-for>
          </div>

          <p style="margin: 12px 2px 0; font-size: 11.5px; color: #94a3b8">Ответы Google Формы попадают в раздел «Брифы» — карточка создаётся оттуда кнопкой. Даты оплаты сдвигаются на месяц после подтверждения.</p>
        </div>
      </sc-if>

      <sc-if value="{{ isTasks }}" hint-placeholder-val="{{ false }}">

                  <div style="padding: 20px; min-width: 0; overflow: hidden; display: flex; flex-direction: column">
                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 14px">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                      <span style="font-size: 13.5px; font-weight: 700; color: #0f172a">Слоты публикации</span>
                    </div>
                    <div style="display: flex; flex-direction: column; flex: 1">
                      <div style="display: flex; flex-direction: column; gap: 10px; flex: 1">
                        <sc-for list="{{ slotRows }}" as="s" hint-placeholder-count="3">
                          <button onClick="{{ s.onToggle }}" style="{{ s.style }}">
                            <span style="font-weight: 600">{{ s.label }}</span>
                            <span style="font-size: 16px; font-weight: 700; color: #334155">{{ s.times }}</span>
                          </button>
                        </sc-for>
                      </div>
                    </div>

              </section>

              <!-- задачи + комментарии -->
            <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: stretch; margin-bottom: 0">

              <section style="background: #fff; border: 1px solid #e8edf5; border-radius: 16px; box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 10px 28px rgba(16,24,40,0.05)">
                <div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                  <button onClick="{{ toggleBlkTasks }}" style="border: none; background: none; padding: 0; cursor: pointer; font-family: inherit; font-size: 13.5px; font-weight: 700; color: #0f172a">Задачи</button>
                  <span style="{{ openTaskCountStyle }}">{{ openTaskCount }}</span>
                  <div style="flex: 1"></div>
                  <button onClick="{{ openNewTask }}" style="border: none; background: none; color: #2563eb; font-size: 12.5px; font-weight: 600; padding: 4px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 4px" style-hover="color: #1d4ed8">+ Поставить задачу</button>
                </div>
                <sc-if value="{{ blkTasksOpen }}" hint-placeholder-val="{{ true }}">
                  <div style="border-top: 1px solid #eef2f7; padding: 6px 0 10px">
                    <sc-for list="{{ cardTasks }}" as="t" hint-placeholder-count="3">
                      <div style="display: flex; align-items: flex-start; gap: 9px; padding: 7px 14px" style-hover="background: #f7faff">
                        <button onClick="{{ t.onDone }}" style="{{ t.boxStyle }}"><span style="{{ t.markStyle }}">✓</span></button>
                        <span style="{{ t.dotStyle }}"></span>
                        <button onClick="{{ t.onOpen }}" style="{{ t.titleStyle }}">{{ t.title }}</button>
                        <span style="{{ t.whenStyle }}">{{ t.when }}</span>
                      </div>
                    </sc-for>
                    <sc-if value="{{ cardTasksEmpty }}" hint-placeholder-val="{{ false }}">
                      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 14px 18px; text-align: center">
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: #f0fdf4; display: grid; place-items: center; overflow: hidden; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                        <p style="margin: 0; font-size: 12.5px; color: #64748b; font-weight: 500">Открытых задач нет.</p>
                        <p style="margin: 0; font-size: 11.5px; color: #a3a7ac">Отличная работа! Все задачи выполнены.</p>
                      </div>
                    </sc-if>
                    <sc-if value="{{ hasDoneTasks }}" hint-placeholder-val="{{ true }}">
                      <button onClick="{{ toggleShowDone }}" style="margin: 6px 14px 0; border: none; background: none; padding: 0; cursor: pointer; font-family: inherit; font-size: 11.5px; color: #6b7078" style-hover="color: #14171a">{{ showDoneLabel }}</button>
                    </sc-if>
                    <sc-for list="{{ cardTasksDone }}" as="t" hint-placeholder-count="2">
                      <div style="display: flex; align-items: flex-start; gap: 9px; padding: 7px 14px; opacity: 0.55">
                        <button onClick="{{ t.onDone }}" style="{{ t.boxStyle }}"><span style="{{ t.markStyle }}">✓</span></button>
                        <span style="{{ t.dotStyle }}"></span>
                        <button onClick="{{ t.onOpen }}" style="{{ t.titleStyle }}">{{ t.title }}</button>
                        <span style="{{ t.whenStyle }}">{{ t.when }}</span>
                      </div>
                    </sc-for>
                  </div>
                </sc-if>

<script>
/**
 * Мини-рантайм шаблонов вместо support.js.
 *
 * Понимает ровно то, что использует разметка карточки клиентов:
 *   {{ путь.к.значению }}   — в тексте и в значениях атрибутов
 *   <sc-for list="{{ … }}" as="имя">   — повтор детей по списку
 *   <sc-if value="{{ … }}">            — вывод детей по условию
 *   onClick / onChange                 — обработчики из renderVals
 *   style-hover                        — стиль при наведении
 *
 * Узлы не пересоздаются, а обновляются на месте — поэтому фокус и
 * каретка в поле ввода не сбрасываются на каждом нажатии клавиши.
 */
(function (global) {
  'use strict';

  /* ---- вычисление выражений ---- */

  function lookup(expr, scope, values) {
    var path = String(expr).trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null' || path === '') return null;

    var parts = path.split('.');
    var cur = parts[0] in scope ? scope[parts[0]] : values[parts[0]];
    for (var i = 1; i < parts.length; i++) {
      if (cur === null || cur === undefined) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  var TOKEN = /\{\{([^}]*)\}\}/g;
  var ONLY_TOKEN = /^\s*\{\{([^}]*)\}\}\s*$/;

  /** Строка целиком из одного выражения возвращается как есть — функцией, массивом, числом. */
  function interpolate(text, scope, values) {
    var single = ONLY_TOKEN.exec(text);
    if (single) return lookup(single[1], scope, values);
    if (text.indexOf('{{') < 0) return text;
    return text.replace(TOKEN, function (_, expr) {
      var value = lookup(expr, scope, values);
      return value === null || value === undefined ? '' : String(value);
    });
  }

  var EVENTS = {
    click: 'click', change: 'input', input: 'input',
    // перетаскивание рубрик: порядок меняется мышью
    dragstart: 'dragstart', dragover: 'dragover', dragenter: 'dragenter',
    dragleave: 'dragleave', drop: 'drop', dragend: 'dragend',
    // ручка «⠿»: перетаскивание включается только с неё, чтобы
    // выделение текста в полях строки продолжало работать
    mousedown: 'mousedown',
    // <input type="file"> слушает 'change', а не 'input'.
    // В разметке пишем onChange='...' на file-input, runtime смотрит сюда.
    filepick: 'change',
    paste: 'paste'
  };

  /* ---- разметка -> дерево описаний ---- */

  function build(node, scope, values, out) {
    if (node.nodeType === 3) {
      var raw = node.nodeValue;
      var text = raw.indexOf('{{') < 0 ? raw : String(interpolate(raw, scope, values) || '');
      out.push({ text: text });
      return;
    }
    if (node.nodeType !== 1) return;

    var tag = node.tagName.toLowerCase();

    if (tag === 'sc-for') {
      var list = interpolate(node.getAttribute('list') || '', scope, values);
      if (!Array.isArray(list)) return;
      var alias = node.getAttribute('as') || 'item';
      for (var i = 0; i < list.length; i++) {
        var inner = Object.create(scope);
        inner[alias] = list[i];
        inner.$index = i;
        buildChildren(node, inner, values, out);
      }
      return;
    }

    if (tag === 'sc-if') {
      if (interpolate(node.getAttribute('value') || '', scope, values)) {
        buildChildren(node, scope, values, out);
      }
      return;
    }

    var vnode = { tag: tag, attrs: {}, events: {}, children: [] };
    for (var a = 0; a < node.attributes.length; a++) {
      var attr = node.attributes[a];
      var name = attr.name.toLowerCase();
      if (name.indexOf('hint-') === 0) continue;      // подсказки редактора холста
      var value = interpolate(attr.value, scope, values);
      if (name.indexOf('on') === 0 && EVENTS[name.slice(2)]) vnode.events[name.slice(2)] = value;
      else vnode.attrs[name] = value;
    }
    buildChildren(node, scope, values, vnode.children);
    out.push(vnode);
  }

  function buildChildren(node, scope, values, out) {
    for (var i = 0; i < node.childNodes.length; i++) {
      build(node.childNodes[i], scope, values, out);
    }
  }

  /* ---- дерево описаний -> DOM ---- */

  function hover(el) {

    el.__hoverBound = true;
    el.addEventListener('mouseenter', function () {
      if (el.__hoverStyle) el.style.cssText = (el.__baseStyle || '') + ';' + el.__hoverStyle;
    });
    el.addEventListener('mouseleave', function () {
      el.style.cssText = el.__baseStyle || '';
    });

  var SVG_ATTR_FIX = { viewbox: 'viewBox', preserveaspectratio: 'preserveAspectRatio', gradienttransform: 'gradientTransform', patterntransform: 'patternTransform', gradientunits: 'gradientUnits', spreadmethod: 'spreadMethod', clippathunits: 'clipPathUnits' };

      else el.removeAttribute(isSvg && SVG_ATTR_FIX[name] || name);
    });

    Object.keys(attrs).forEach(function (name) {
      var value = attrs[name];

      if (name === 'style') {
        var css = value === null || value === undefined ? '' : String(value);
        if (el.__baseStyle !== css) {
          el.__baseStyle = css;
          el.style.cssText = css;
        }
        return;
      }
      if (name === 'style-hover') {
        el.__hoverStyle = value === null || value === undefined ? '' : String(value);
        hover(el);
        return;
      }
      if (name === 'value' && ('value' in el)) {
        var next = value === null || value === undefined ? '' : String(value);
        if (el !== document.activeElement) { el.value = next; }
        return;
      }
      if (name === 'checked') {
        el.checked = !!value;
        return;
      }
      if (value === false || value === null || value === undefined) {
        el.removeAttribute(name);
        return;
      }
      var str = String(value);
      var attrName = isSvg && SVG_ATTR_FIX[name] || name;
      if (el.getAttribute(attrName) !== str) el.setAttribute(attrName, str);
    });
  }

  function bindEvents(el, events) {
    el.__handlers = events;
    Object.keys(EVENTS).forEach(function (kind) {
      if (!events[kind] || el['__bound_' + kind]) return;
      el['__bound_' + kind] = true;
      el.addEventListener(EVENTS[kind], function (e) {
        var handler = el.__handlers && el.__handlers[kind];
        if (typeof handler === 'function') handler(e);
      });
      // файлы/чекбоксы/селекты не всегда шлют 'input' — подписываемся и на нативный 'change'
      if (kind === 'change' && EVENTS[kind] !== 'change' && !el['__bound_change_native']) {
        el['__bound_change_native'] = true;
        el.addEventListener('change', function (e) {
          var handler = el.__handlers && el.__handlers.change;
          if (typeof handler === 'function') handler(e);
        });
      }
    });
  }

  var SVG_NS = 'http://www.w3.org/2000/svg';
  var SVG_TAGS = { svg:1, path:1, circle:1, rect:1, line:1, polyline:1, polygon:1, ellipse:1, g:1, defs:1, use:1, text:1, tspan:1, linearGradient:1, radialGradient:1, stop:1, clipPath:1, mask:1, pattern:1, filter:1, image:1, symbol:1, marker:1 };

  function create(vnode, inSvg) {
    if (vnode.text !== undefined) {
      vnode.el = document.createTextNode(vnode.text);
      return vnode.el;
    }
    var isSvg = inSvg || vnode.tag === 'svg' || SVG_TAGS[vnode.tag];
    var el = isSvg ? document.createElementNS(SVG_NS, vnode.tag) : document.createElement(vnode.tag);
    vnode.el = el;
    // дети раньше атрибутов: <select value="…"> должен видеть свои <option>
    vnode.children.forEach(function (child) { el.appendChild(create(child, isSvg)); });
    applyAttrs(el, {}, vnode.attrs);
    bindEvents(el, vnode.events);
    return el;
  }

  function sameKind(a, b) {
    if (a.text !== undefined || b.text !== undefined) {
      return a.text !== undefined && b.text !== undefined;
    }
    return a.tag === b.tag;
  }

  function patchNode(oldVnode, vnode) {
    var el = vnode.el = oldVnode.el;
    if (vnode.text !== undefined) {
      if (el.nodeValue !== vnode.text) el.nodeValue = vnode.text;
      return;
    }
    applyAttrs(el, oldVnode.attrs, vnode.attrs);
    bindEvents(el, vnode.events);
    patchChildren(el, oldVnode.children, vnode.children);
  }

  function patchChildren(parent, oldList, list) {
    var inSvg = parent.namespaceURI === SVG_NS;
    var count = Math.max(oldList.length, list.length);
    for (var i = 0; i < count; i++) {
      var was = oldList[i];
      var now = list[i];

      if (!now) {
        if (was && was.el && was.el.parentNode === parent) parent.removeChild(was.el);
      } else if (!was) {
        parent.appendChild(create(now, inSvg));
      } else if (sameKind(was, now)) {
        patchNode(was, now);
      } else {
        parent.replaceChild(create(now, inSvg), was.el);
      }
    }
  }

  /* ---- компонент ---- */

  function Logic() {
    this.props = {};
  }

  Logic.prototype.setState = function (updater) {
    var patch = typeof updater === 'function' ? updater(this.state) : updater;
    this.state = Object.assign({}, this.state, patch);
    if (this.__onChange) this.__onChange();
  };

  /**
   * mount(template, Component, props, root) — собирает страницу и держит её
   * в актуальном состоянии. Перерисовка откладывается в микрозадачу, чтобы
   * несколько setState подряд давали один проход.
   */
  function mount(template, Component, props, root) {
    var component = new Component();
    component.props = props || {};

    var vnodes = [];
    var scheduled = false;

    function draw() {
      scheduled = false;
      var values;
      try {
        values = component.renderVals();
      } catch (err) {
        console.error('Ошибка renderVals:', err);
        return;
      }
      var next = [];
      var scope = Object.create(null);
      for (var i = 0; i < template.childNodes.length; i++) {
        build(template.childNodes[i], scope, values, next);
      }
      try {
        patchChildren(root, vnodes, next);
        vnodes = next;
      } catch (err) {
        console.error('Ошибка отрисовки:', err);
      }
    }

    component.__onChange = function () {
      if (scheduled) return;
      scheduled = true;
      Promise.resolve().then(draw);
    };

    draw();
    return component;
  }

  global.DCLogic = Logic;
  global.mountPage = mount;
})(window);

<script>
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
// Типы рубрик — должны совпадать с Code.gs (RUBRIC_KINDS без 'default')
const RUBRIC_KINDS = ['faq','docs','results','inspiration','photo_case',
  'observation','tips','before_after','promo','news','team','howto','service'];
const RUBRIC_KIND_LABELS = {
  faq: 'FAQ — ответ на вопрос', docs: 'Документы / объекты',
  results: 'Результаты / отзывы', inspiration: 'Идеи / вдохновение',
  photo_case: 'Фото работ (photo_case)', observation: 'Наблюдение из практики',
  tips: 'Советы / полезное', 'before_after': 'До и после',
  promo: 'Акция / оффер', news: 'Новость / событие',
  team: 'Команда / за кулисами', howto: 'Инструкция / how-to',
  service: 'Услуга / продукт'
};
// Папка на Яндекс.Диске, откуда рубрика берёт фото — то же решение, что
// rubric_folder() в clients_post.py и rubricFolder_() в Code.gs: сначала
// явный выбор клиента (поле photo_folder — выпадающий список в интерфейсе),
// потом kind, и только для старых рубрик без обоих — угадывание по названию.
const PHOTO_FOLDERS = ['to_post', 'rubrics/faq', 'rubrics/ideas', 'rubrics/reviews', 'rubrics/tips'];
const RUBRIC_KIND_FOLDER = {
  photo_case: 'to_post', before_after: 'to_post',
  results: 'rubrics/reviews', tips: 'rubrics/tips',
  faq: 'rubrics/faq', inspiration: 'rubrics/ideas'
};
const FOLDER_KIND_DEFAULT = {
  to_post: 'photo_case', 'rubrics/reviews': 'results',
  'rubrics/tips': 'tips', 'rubrics/faq': 'faq', 'rubrics/ideas': 'inspiration'
};
const FOLDER_NAME_GUESS = [
  [/совет|польз/, 'rubrics/tips'],
  [/вопрос|чзв|faq/, 'rubrics/faq'],
  [/иде|вдохнов/, 'rubrics/ideas'],
  [/отзыв|результат/, 'rubrics/reviews']
];
function rubricFolderPath(r) {
  const explicit = String((r && r.photo_folder) || '').toLowerCase();
  if (PHOTO_FOLDERS.indexOf(explicit) >= 0) return { folder: explicit, source: 'explicit' };
  const kind = String((r && r.kind) || '').toLowerCase();
  if (RUBRIC_KIND_FOLDER[kind]) return { folder: RUBRIC_KIND_FOLDER[kind], source: 'kind' };
  const name = String((r && r.name) || '').toLowerCase();
  for (let i = 0; i < FOLDER_NAME_GUESS.length; i++) {
    if (FOLDER_NAME_GUESS[i][0].test(name)) return { folder: FOLDER_NAME_GUESS[i][1], source: 'name' };
  }
  return { folder: 'to_post', source: 'name' };
}
const SCREENSHOT_MAX = 8;
/* Потолки бэкенда (Code.gs): 1.6 МБ base64 на картинку и 6 МБ на пачку.
 * Скриншот с монитора в PNG легко весит больше, поэтому перед отправкой
 * уменьшаем длинную сторону и пережимаем в JPEG прямо в браузере. */
const SCREENSHOT_LIMIT_BYTES = 1600000;
const SCREENSHOT_MAX_SIDE = 1400;
const SCREENSHOT_QUALITY = 0.82;

/** Файл -> { name, data: 'data:image/jpeg;base64,…' }. */
function readScreenshot(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Не удалось прочитать файл: ' + file.name));
    reader.onload = ev => {
      const img = new Image();
      img.onerror = () => reject(new Error('Это не картинка: ' + file.name));
      img.onload = () => {
        const scale = Math.min(1, SCREENSHOT_MAX_SIDE / Math.max(img.width, img.height, 1));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';          // прозрачный PNG -> белый фон, иначе JPEG чернит
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let data = canvas.toDataURL('image/jpeg', SCREENSHOT_QUALITY);
        if (data.length > SCREENSHOT_LIMIT_BYTES) data = canvas.toDataURL('image/jpeg', 0.6);
        if (data.length > SCREENSHOT_LIMIT_BYTES) {
          reject(new Error('Слишком тяжёлый скриншот: ' + file.name));
          return;
        }
        resolve({ name: file.name, data: data });
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
/* ------------------------------------------------------------------
 * РЕЕСТР ТАРИФОВ
 * Зеркало tariffs.json из корня репозитория. При загрузке страницы
 * подменяется свежей копией с ../tariffs.json — правки в репозитории
 * подхватываются без пересборки CRM. Этот объект нужен как запасной,
 * чтобы интерфейс отрисовался до ответа сети и работал в демо-режиме.
 * ------------------------------------------------------------------ */
let TARIFFS = {
  aliases: {
    'СТАРТ': 'start', 'START': 'start',
    'ПРО': 'pro', 'ПРОФИ': 'pro', 'PRO': 'pro',
    'БИЗНЕС': 'business', 'BUSINESS': 'business',
    'ПРЕМИУМ': 'premium', 'PREMIUM': 'premium',
    'МАКСИМУМ': 'max', 'MAX': 'max', 'ENTERPRISE': 'max'
  },
  enums: {

/** Все id по возрастанию order. */
function tariffIds() {
  const T = TARIFFS.tariffs;
  return Object.keys(T).sort((a, b) => (T[a].order || 0) - (T[b].order || 0));
}

function defaultTariffId() { return tariffIds()[0] || 'start'; }

function tariffDef(id) { return TARIFFS.tariffs[id] || TARIFFS.tariffs[defaultTariffId()] || null; }

function tariffName(id) { const d = tariffDef(id); return d ? d.name : ''; }

/** Любое написание (id, имя, алиас, «БИЗНЕС — 2 поста в день») -> id. */
function normTariff(v) {
  const T = TARIFFS.tariffs, A = TARIFFS.aliases || {};
  const s = String(v === null || v === undefined ? '' : v)
    .toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
  if (!s) return defaultTariffId();
  if (T[s]) return s;
  for (const a in A) if (a.toLowerCase() === s && T[A[a]]) return A[a];
  for (const id in T) if (String(T[id].name).toLowerCase() === s) return id;
  const desc = tariffIds().slice().reverse();
  for (let i = 0; i < desc.length; i++) {
    if (s.indexOf(String(T[desc[i]].name).toLowerCase()) >= 0 || s.indexOf(desc[i]) >= 0) return desc[i];
  }
  for (const a2 in A) if (T[A[a2]] && s.indexOf(a2.toLowerCase()) >= 0) return A[a2];
  return defaultTariffId();
}

/** Лимиты: наследование -> собственные -> персональный оверрайд клиента. */
function tariffLimits(tariffOrClient) {
  let id, override = null;
  if (tariffOrClient && typeof tariffOrClient === 'object') {
    id = normTariff(tariffOrClient.tariffId || tariffOrClient.tariff);
    override = tariffOrClient.limitsOverride || null;
    if (typeof override === 'string') { try { override = JSON.parse(override); } catch (e) { override = null; } }
  } else {
    id = normTariff(tariffOrClient);
  }
  const def = tariffDef(id);
  const out = {};
  if (!def) return out;
  const put = src => { for (const k in src) if (k.charAt(0) !== '_') out[k] = src[k]; };
  if (def.inherits && tariffDef(def.inherits)) put(tariffDef(def.inherits).limits || {});
  put(def.limits || {});
  if (override) put(override);
  return out;
}

const TASK_FONTS = [14, 16, 18];

function sanitizeTaskHtml(raw) {
  let s = String(raw == null ? '' : raw);
  if (!s) return '';
  if (s.length > 20000) s = s.slice(0, 20000);
  s = s.replace(/<!--[\s\S]*?-->/g, '');
  s = s.replace(/<(script|style|iframe|object|embed|svg|math|form)\b[\s\S]*?<\/\1\s*>/gi, '');
  s = s.replace(/<\/?([a-zA-Z0-9]+)([^>]*)>/g, (all, tag, attrs) => {
    const name = String(tag).toLowerCase();
    if (!TASK_TAGS[name]) return '';
    if (all.charAt(1) === '/') return '</' + name + '>';
    if (name === 'br') return '<br>';
    if (name === 'span') {
      const m = String(attrs || '').match(/font-size\s*:\s*(\d{1,3})\s*px/i);
      const px = m ? Number(m[1]) : 0;
      return TASK_FONTS.indexOf(px) >= 0 ? '<span style="font-size:' + px + 'px">' : '<span>';
    }
    return '<' + name + '>';
  });
  return s.replace(/<(?![a-zA-Z\/])/g, '&lt;');
}

function stripHtml(raw) {
  return String(raw == null ? '' : raw)
    .replace(/<\s*br\s*\/?>/gi, '\n')
    .replace(/<\/\s*(div|p|li)\s*>/gi, '\n')
    .replace(/<[^>]*>/g, '')
    .replace(/&nbsp;/gi, ' ').replace(/&lt;/gi, '<').replace(/&gt;/gi, '>')
    .replace(/&quot;/gi, '"').replace(/&#39;/g, "'").replace(/&amp;/gi, '&')
    .replace(/\n{3,}/g, '\n\n').trim();
}

/* ====================================================================
 *  ПОДКЛЮЧЕНИЕ К APPS SCRIPT WEB APP
 *
 *  Все обращения к таблице, GitHub и RouterAI идут через Web App:
 *  секреты лежат в Script Properties и в браузер не попадают.
 *  Здесь хранится только адрес Web App и токен доступа к нему —
 *  в localStorage этого браузера.
 * ================================================================== */

const CONN_KEY = 'smm-crm.connection';

function loadConn() {
  const empty = { WEBAPP_URL: '', API_TOKEN: '' };
  try {
    const raw = window.localStorage.getItem(CONN_KEY);
    return raw ? Object.assign(empty, JSON.parse(raw)) : empty;
  } catch (e) { return empty; }
}

function storeConn(conn) {
  try { window.localStorage.setItem(CONN_KEY, JSON.stringify(conn)); } catch (e) {}
}

function readBody(res) {
  return res.text().then(function (text) {
    let data = null;
    try { data = JSON.parse(text); } catch (e) {
      throw new Error('Web App ответил не JSON (HTTP ' + res.status + '). Проверьте, что деплой открыт «Все, у кого есть ссылка».');
    }
    if (data.ok === false) throw new Error(data.error || 'ошибка Web App');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return data;
  });
}

function apiGet(conn, action, params) {
  if (!conn.WEBAPP_URL) return Promise.reject(new Error('не задан WEBAPP_URL — откройте Настройки'));
  const qs = ['action=' + encodeURIComponent(action)];
  Object.keys(params || {}).forEach(k => qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k])));
  if (conn.API_TOKEN) qs.push('token=' + encodeURIComponent(conn.API_TOKEN));
  const url = conn.WEBAPP_URL + (conn.WEBAPP_URL.indexOf('?') >= 0 ? '&' : '?') + qs.join('&');
  return fetch(url, { method: 'GET', redirect: 'follow' }).then(readBody);
}

function apiPost(conn, action, body) {
  if (!conn.WEBAPP_URL) return Promise.reject(new Error('не задан WEBAPP_URL — откройте Настройки'));
  const payload = Object.assign({ action: action, token: conn.API_TOKEN || '' }, body || {});
  // Content-Type: text/plain — «простой» запрос без preflight:
  // Apps Script не отвечает на OPTIONS, поэтому application/json здесь не годится.
  return fetch(conn.WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow'
  }).then(readBody);
}

function parseDate(v) {
  if (!v) return null;
  if (v instanceof Date) return v;
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? d(Number(m[1]), Number(m[2]), Number(m[3])) : null;
}

function isoDate(dt) {
  if (!dt) return '';
  const p = n => (n < 10 ? '0' : '') + n;
  return dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate());
}

function padAnswers(v) {
  const arr = (Array.isArray(v) ? v : []).map(x => String(x || ''));
  while (arr.length < 5) arr.push('');

}

/**
 * Файл из ответа Web App -> скачивание на компьютер. Данные приходят в
 * base64 и нигде не хранятся: ни на Google Диске, ни на сервере.
 */
function downloadBase64(b64, filename, mime) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bytes], { type: mime || 'application/octet-stream' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
