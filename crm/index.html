<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMM-сервис · CRM</title>
<!--
  Файл собран из «Клиенты.dc.html» скриптом crm/build_page.py — руками не правьте.
  Меняйте холст и пересобирайте:  python3 crm/build_page.py
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; background: #f2f2ef; color: #14171a; -webkit-font-smoothing: antialiased; }
  a { color: #2b4acf; text-decoration: none; }
  a:hover { color: #14171a; text-decoration: underline; }
  input, textarea, button, select { font-family: inherit; font-size: inherit; color: inherit; }
  input:focus, textarea:focus { outline: 2px solid #c8d1f7; outline-offset: -1px; }
  *::placeholder { color: #a3a7ac; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d6d6d1; border-radius: 6px; }
</style>
</head>
<body>

<div id="crm-root"></div>

<template id="crm-template">
<div style="display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #f2f2ef">

  <header style="display: flex; align-items: center; gap: 18px; height: 50px; flex: none; padding: 0 18px; background: #14171a; color: #f4f4f1">
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span style="font-weight: 700; font-size: 14px; letter-spacing: -0.01em">SMM-сервис</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8b9098; text-transform: uppercase; letter-spacing: 0.08em">crm</span>
    </div>
    <div style="flex: 1"></div>
    <div style="display: flex; align-items: center; gap: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8b9098">
      <span>Таблица: <span style="color: #d8dbdf">Клиенты</span></span>
      <span>Синхронизация: <span style="color: #d8dbdf">{{ syncedAt }}</span></span>
    </div>
    <div style="width: 26px; height: 26px; border-radius: 50%; background: #3d434b; color: #f4f4f1; display: grid; place-items: center; font-size: 11px; font-weight: 600">ВМ</div>
  </header>

  <div style="display: flex; flex: 1; min-height: 0">

    <nav style="width: 194px; flex: none; background: #fbfbf9; border-right: 1px solid #e3e3df; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="5">
        <button onClick="{{ n.onClick }}" style="{{ n.style }}">
          <span>{{ n.label }}</span>
          <span style="{{ n.badgeStyle }}">{{ n.badge }}</span>
        </button>
      </sc-for>
      <div style="flex: 1"></div>
      <div style="border-top: 1px solid #e9e9e5; padding: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; line-height: 1.7; color: #9a9ea4">
        <div>Apps Script Web App</div>
        <div>монорепо: vk-autopost</div>
      </div>
    </nav>

    <main style="flex: 1; min-width: 0; overflow-y: auto">

      <sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
        <div style="padding: 20px 22px 40px; max-width: 1240px">

          <div style="display: flex; align-items: flex-end; gap: 16px; margin-bottom: 16px">
            <div>
              <h1 style="margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.015em">Клиенты</h1>
              <p style="margin: 4px 0 0; font-size: 12.5px; color: #6b7078">Подписки, оплаты и статус ведения. Клик по строке — карточка клиента.</p>
            </div>
            <div style="flex: 1"></div>
            <button onClick="{{ openNew }}" style="border: 1px solid #14171a; background: #14171a; color: #fbfbf9; font-size: 12.5px; font-weight: 500; padding: 8px 13px; border-radius: 5px; cursor: pointer" style-hover="background: #2b3138; border-color: #2b3138">Новый клиент вручную</button>
          </div>

          <sc-if value="{{ showStats }}" hint-placeholder-val="{{ true }}">
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px">
              <div style="background: #fff; border: 1px solid #e3e3df; border-radius: 6px; padding: 12px 14px">
                <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #8a8f96; font-weight: 500">Активных</div>
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; margin-top: 5px">{{ statActive }}</div>
              </div>
              <div style="background: #fff; border: 1px solid #e3e3df; border-radius: 6px; padding: 12px 14px">
                <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #8a8f96; font-weight: 500">MRR</div>
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; margin-top: 5px">{{ statMrr }}</div>
              </div>
              <div style="background: #fff; border: 1px solid #e3e3df; border-radius: 6px; padding: 12px 14px">
                <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #8a8f96; font-weight: 500">Ждут оплаты</div>
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; margin-top: 5px; color: #8a5a00">{{ statDue }}</div>
              </div>
              <div style="background: #fff; border: 1px solid #e3e3df; border-radius: 6px; padding: 12px 14px">
                <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #8a8f96; font-weight: 500">Просрочка</div>
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; margin-top: 5px; color: #b3261e">{{ statOverdue }}</div>
              </div>
            </div>
          </sc-if>

          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px">
            <input type="text" placeholder="Поиск: имя, бизнес, город, client_id" value="{{ q }}" onChange="{{ onSearch }}" style="width: 300px; padding: 7px 10px; border: 1px solid #d9d9d4; border-radius: 5px; background: #fff; font-size: 12.5px" />
            <div style="display: flex; gap: 4px; background: #eaeae6; padding: 3px; border-radius: 6px">
              <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
                <button onClick="{{ f.onClick }}" style="{{ f.style }}">{{ f.label }}</button>
              </sc-for>
            </div>
            <div style="flex: 1"></div>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8a8f96">{{ shownCount }} из {{ totalCount }}</span>
          </div>

          <div style="background: #fff; border: 1px solid #e3e3df; border-radius: 6px; overflow-x: auto">
            <div style="display: grid; grid-template-columns: minmax(150px, 2fr) 62px 100px 88px minmax(104px, 1fr) 58px; gap: 10px; min-width: 620px; padding: 9px 14px; border-bottom: 1px solid #e3e3df; background: #f8f8f5; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #7c8189">
              <div>Клиент</div>
              <div>Тариф</div>
              <div>Оплата</div>
              <div>Платёж</div>
              <div>Последний пост</div>
              <div style="text-align: right">Вкл.</div>
            </div>
            <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
              <div onClick="{{ r.onOpen }}" style="{{ r.rowStyle }}" style-hover="background: #f7f8fd">
                <div style="min-width: 0">
                  <div style="font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.business }}</div>
                  <div style="font-size: 11.5px; color: #767b83; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px">{{ r.sub }}</div>
                </div>
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 500; padding-top: 2px">{{ r.tariff }}</div>
                <div style="padding-top: 1px"><span style="{{ r.payStyle }}">{{ r.payLabel }}</span></div>
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding-top: 3px">{{ r.nextPay }}</div>
                <div style="min-width: 0; padding-top: 3px">
                  <div style="font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.lastPost }}</div>
                  <div style="font-size: 11px; color: #8a8f96; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px">{{ r.slots }}</div>
                </div>
                <div style="display: flex; justify-content: flex-end; padding-top: 1px">
                  <button onClick="{{ r.onToggle }}" style="{{ r.toggleStyle }}"><span style="{{ r.knobStyle }}"></span></button>
                </div>
              </div>
            </sc-for>
          </div>

          <p style="margin: 12px 2px 0; font-size: 11.5px; color: #8a8f96">Ответы Google Формы попадают в раздел «Брифы» — карточка создаётся оттуда кнопкой. Даты оплаты сдвигаются на месяц после подтверждения.</p>
        </div>
      </sc-if>

      <sc-if value="{{ isCard }}" hint-placeholder-val="{{ true }}">
        <div>

          <div style="background: #fff; border-bottom: 1px solid #e3e3df; padding: 14px 22px 0">
            <button onClick="{{ back }}" style="border: none; background: none; padding: 0; font-size: 12px; color: #6b7078; cursor: pointer" style-hover="color: #14171a">← Все клиенты</button>
            <div style="display: flex; align-items: flex-start; gap: 14px; margin-top: 8px; flex-wrap: wrap">
              <div style="min-width: 0; flex: 1 1 320px">
                <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
                  <h1 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.015em; min-width: 0">{{ c.business }}</h1>
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #7c8189; background: #f2f2ef; border: 1px solid #e3e3df; padding: 2px 6px; border-radius: 4px">{{ c.id }}</span>
                  <span style="{{ c.payStyle }}">{{ c.payLabel }}</span>
                </div>
                <div style="display: flex; gap: 6px 14px; margin-top: 6px; font-size: 12px; color: #6b7078; flex-wrap: wrap">
                  <span style="white-space: nowrap">{{ c.name }}</span>
                  <span style="white-space: nowrap">{{ c.niche }}, {{ c.city }}</span>
                  <span style="font-family: 'IBM Plex Mono', monospace; white-space: nowrap">{{ c.tariff }} · {{ c.price }} ₽/мес</span>
                </div>
              </div>
              <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto">
                <button onClick="{{ onSave }}" style="border: 1px solid #d9d9d4; background: #fff; font-size: 12.5px; font-weight: 500; padding: 8px 13px; border-radius: 5px; cursor: pointer" style-hover="border-color: #14171a">{{ saveLabel }}</button>
                <button onClick="{{ onPush }}" style="{{ btnPush }}" style-hover="opacity: 0.88">{{ pushLabel }}</button>
              </div>
            </div>
            <div style="display: flex; gap: 2px; margin-top: 14px; flex-wrap: wrap">
              <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
                <button onClick="{{ t.onClick }}" style="{{ t.style }}">{{ t.label }}</button>
              </sc-for>
            </div>
          </div>

          <div style="padding: 18px 22px 60px; max-width: 1180px">

            <sc-if value="{{ tabBrief }}" hint-placeholder-val="{{ true }}">
              <div style="display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; align-items: start">

                <div style="display: flex; flex-direction: column; gap: 14px">
                  <section style="background: #fff; border: 1px solid #e3e3df; border-radius: 6px; padding: 14px 16px 16px">
                    <h2 style="margin: 0 0 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: #7c8189">Бизнес и аудитория</h2>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px">
                      <label style="display: block">
                        <span style="display: block; font-size: 11.5px; color: #6b7078; margin-bottom: 4px">Название бизнеса / бренда</span>
                        <input type="text" value="{{ c.business }}" onChange="{{ set.business }}" style="width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #dedeD9; border-radius: 4px; background: #fff; font-size: 13px" />
                      </label>
                      <label style="display: block">
                        <span style="display: block; font-size: 11.5px; color: #6b7078; margin-bottom: 4px">Город / регион</span>
                        <input type="text" value="{{ c.city }}" onChange="{{ set.city }}" style="width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #dedeD9; border-radius: 4px; background: #fff; font-size: 13px" />
                      </label>
                    </div>
                    <label style="display: block; margin-top: 10px">
                      <span style="display: block; font-size: 11.5px; color: #6b7078; margin-bottom: 4px">Чем занимаетесь и что продаёте</span>
                      <textarea rows="3" value="{{ c.about }}" onChange="{{ set.about }}" style="width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #dedeD9; border-radius: 4px; background: #fff; font-size: 13px; line-height: 1.5; resize: vertical"></textarea>
                    </label>
                    <label style="display: block; margin-top: 10px">
                      <span style="display: block; font-size: 11.5px; color: #6b7078; margin-bottom: 4px">Типичный клиент</span>
                      <textarea rows="2" value="{{ c.audience }}" onChange="{{ set.audience }}" style="width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #dedeD9; border-radius: 4px; background: #fff; font-size: 13px; line-height: 1.5; resize: vertical"></textarea>
                    </label>
                  </section>

                  <section style="background: #fff; border: 1px solid #e3e3df; border-radius: 6px; padding: 14px 16px 16px">
                    <h2 style="margin: 0 0 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: #7c8189">Контент</h2>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px">
                      <label style="display: block">
                        <span style="display: block; font-size: 11.5px; color: #6b7078; margin-bottom: 4px">Тон общения</span>
                        <select value="{{ c.tone }}" onChange="{{ set.tone }}" style="width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #dedeD9; border-radius: 4px; background: #fff; font-size: 13px">
                          <option>Простой и дружелюбный — как друг</option>
                          <option>Экспертный — как специалист</option>
                          <option>Деловой — как компания</option>
                        </select>
                      </label>
                      <label style="display: block">
                        <span style="display: block; font-size: 11.5px; color: #6b7078; margin-bottom: 4px">Праздничные посты</span>
                        <select value="{{ c.holidays }}" onChange="{{ set.holidays }}" style="width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #dedeD9; border-radius: 4px; background: #fff; font-size: 13px">
                          <option>Да, со скидками</option>
                          <option>Да, но без упоминания скидок</option>
                          <option>Не нужны</option>
                        </select>
                      </label>
                    </div>
                    <label style="display: block; margin-top: 10px">
                      <span style="display: flex; align-items: baseline; gap: 7px; margin-bottom: 4px">
                        <span style="font-size: 11.5px; color: #6b7078">Свои праздники — по одному в строке</span>
                        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #a3a7ac">ДД.ММ Название</span>
                      </span>
                      <textarea rows="2" placeholder="08.02 День риелтора" value="{{ c.holidaysExtra }}" onChange="{{ set.holidaysExtra }}" style="width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #dedeD9; border-radius: 4px; background: #fff; font-size: 13px; line-height: 1.5; resize: vertical; font-family: 'IBM Plex Mono', monospace"></textarea>
                      <span style="display: block; font-size: 11px; color: #8a8f96; margin-top: 4px">{{ holidayHint }}</span>
                      <sc-if value="{{ hasNicheHolidays }}" hint-placeholder-val="{{ false }}">
                        <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px">
                          <sc-for list="{{ nicheHolidayChips }}" as="h" hint-placeholder-count="2">
                            <button onClick="{{ h.onClick }}" style="{{ h.style }}">{{ h.label }}</button>
                          </sc-for>
                        </div>
                        <span style="display: block; font-size: 11px; color: #8a8f96; margin-top: 6px">Подобрано по нише — клик добавляет или убирает строку</span>
                      </sc-if>
                    </label>
                    <div style="margin-top: 12px">
                      <span style="display: block; font-size: 11.5px; color: #6b7078; margin-bottom: 6px">Рубрики из брифа</span>
                      <div style="display: flex; flex-wrap: wrap; gap: 6px">
                        <sc-for list="{{ topicChips }}" as="t" hint-placeholder-count="5">
                          <button onClick="{{ t.onClick }}" style="{{ t.style }}">{{ t.label }}</button>
                        </sc-for>
                      </div>
                    </div>
                    <label style="display: block; margin-top: 12px">
                      <span style="display: block; font-size: 11.5px; color: #6b7078; margin-bottom: 4px">FAQ — вопрос / ответ</span>
                      <textarea rows="3" value="{{ c.faq }}" onChange="{{ set.faq }}" style="width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #dedeD9; border-radius: 4px; background: #fff; font-size: 13px; line-height: 1.5; resize: vertical"></textarea>
                    </label>
                    <label style="display: block; margin-top: 10px">
                      <span style="display: block; font-size: 11.5px; color: #6b7078; margin-bottom: 4px">Заглушка — призыв к действию в конце поста</span>
                      <textarea rows="2" value="{{ c.cta }}" onChange="{{ set.cta }}" style="width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #dedeD9; border-radius: 4px; background: #fff; font-size: 13px; line-height: 1.5; resize: vertical"></textarea>
                    </label>
                  </section>

                  <section style="background: #fff; border: 1px solid #e3e3df; border-radius: 6px; padding: 14px 16px 16px">
                    <h2 style="margin: 0 0 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: #7c8189">Ограничения</h2>
                    <p style="margin: 0 0 10px; font-size: 11.5px; color: #8a8f96">Уходит в промпт как жёсткий запрет. Для ниш с риском — недвижимость, страхование, медицина — обязательно.</p>
                    <div style="display: flex; flex-direction: column; gap: 7px">
                      <sc-for list="{{ limitBoxes }}" as="l" hint-placeholder-count="5">
                        <label style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; cursor: pointer">
                          <input type="checkbox" checked="{{ l.checked }}" onChange="{{ l.onToggle }}" style="width: 14px; height: 14px; accent-color: #14171a; margin: 0" />
                          <span>{{ l.label }}</span>
                        </label>
                      </sc-for>
                    </div>
                    <label style="display: block; margin-top: 11px">
                      <span style="display: block; font-size: 11.5px; color: #6b7078; margin-bottom: 4px">Что ещё нельзя упоминать</span>
                      <textarea rows="2" value="{{ c.limitsText }}" onChange="{{ set.limitsText }}" style="width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #dedeD9; border-radius: 4px; background: #fff; font-size: 13px; line-height: 1.5; resize: vertical"></textarea>
                    </label>
                  </section>
                </div>

                <div style="display: flex; flex-direction: column; gap: 14px">
                  <section style="background: #fff; border: 1px solid #e3e3df; border-radius: 6px; padding: 14px 16px 16px">
                    <h2 style="margin: 0 0 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: #7c8189">Контакты</h2>
                    <div style="display: flex; flex-direction: column; gap: 10px">
                      <label style="display: block">
                        <span style="display: block; font-size: 11.5px; color: #6b7078; margin-bottom: 4px">ФИО</span>
                        <input type="text" value="{{ c.name }}" onChange="{{ set.name }}" style="width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #dedeD9; border-radius: 4px; background: #fff; font-size: 13px" />
                      </label>
                      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
                        <label style="display: block">
                          <span style="display: block; font-size: 11.5px; color: #6b7078; margin-bottom: 4px">Телефон</span>
                          <input type="text" value="{{ c.phone }}" onChange="{{ set.phone }}" style="width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #dedeD9; border-radius: 4px; background: #fff; font-size: 13px; font-family: 'IBM Plex Mono', monospace" />
                        </label>
                        <label style="display: block">
                          <span style="display: block; font-size: 11.5px; color: #6b7078; margin-bottom: 4px">Telegram</span>
                          <input type="text" value="{{ c.tg }}" onChange="{{ set.tg }}" style="width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #dedeD9; border-radius: 4px; background: #fff; font-size: 13px; font-family: 'IBM Plex Mono', monospace" />
                        </label>
                      </div>
                      <label style="display: block">
                        <span style="display: block; font-size: 11.5px; color: #6b7078; margin-bottom: 4px">Email</span>
                        <input type="text" value="{{ c.email }}" onChange="{{ set.email }}" style="width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #dedeD9; border-radius: 4px; background: #fff; font-size: 13px; font-family: 'IBM Plex Mono', monospace" />
                      </label>
                      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 4px; border-top: 1px solid #eeeeea">
                        <div>
                          <div style="font-size: 11.5px; color: #6b7078">Источник</div>
                          <div style="font-size: 13px; margin-top: 3px">{{ c.source }}</div>
                        </div>
                        <div>
                          <div style="font-size: 11.5px; color: #6b7078">Дата подключения</div>

<script>
/**
 * Мини-рантайм шаблонов вместо support.js.
 *
 * Понимает ровно то, что использует разметка карточки клиентов:
 *   {{ путь.к.значению }}   — в тексте и в значениях атрибутов
 *   <sc-for list="{{ … }}" as="имя">   — повтор детей по списку
 *   <sc-if value="{{ … }}">            — вывод детей по условию
 *   onClick / onChange                 — обработчики из renderVals
 *   style-hover                        — стиль при наведении
 *
 * Узлы не пересоздаются, а обновляются на месте — поэтому фокус и
 * каретка в поле ввода не сбрасываются на каждом нажатии клавиши.
 */
(function (global) {
  'use strict';

  /* ---- вычисление выражений ---- */

  function lookup(expr, scope, values) {
    var path = String(expr).trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null' || path === '') return null;

    var parts = path.split('.');
    var cur = parts[0] in scope ? scope[parts[0]] : values[parts[0]];
    for (var i = 1; i < parts.length; i++) {
      if (cur === null || cur === undefined) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  var TOKEN = /\{\{([^}]*)\}\}/g;
  var ONLY_TOKEN = /^\s*\{\{([^}]*)\}\}\s*$/;

  /** Строка целиком из одного выражения возвращается как есть — функцией, массивом, числом. */
  function interpolate(text, scope, values) {
    var single = ONLY_TOKEN.exec(text);
    if (single) return lookup(single[1], scope, values);
    if (text.indexOf('{{') < 0) return text;
    return text.replace(TOKEN, function (_, expr) {
      var value = lookup(expr, scope, values);
      return value === null || value === undefined ? '' : String(value);
    });
  }

  /* ---- разметка -> дерево описаний ---- */

  function build(node, scope, values, out) {
    if (node.nodeType === 3) {
      var raw = node.nodeValue;
      var text = raw.indexOf('{{') < 0 ? raw : String(interpolate(raw, scope, values) || '');
      out.push({ text: text });
      return;
    }
    if (node.nodeType !== 1) return;

    var tag = node.tagName.toLowerCase();

    if (tag === 'sc-for') {
      var list = interpolate(node.getAttribute('list') || '', scope, values);
      if (!Array.isArray(list)) return;
      var alias = node.getAttribute('as') || 'item';
      for (var i = 0; i < list.length; i++) {
        var inner = Object.create(scope);
        inner[alias] = list[i];
        inner.$index = i;
        buildChildren(node, inner, values, out);
      }
      return;
    }

    if (tag === 'sc-if') {
      if (interpolate(node.getAttribute('value') || '', scope, values)) {
        buildChildren(node, scope, values, out);
      }
      return;
    }

    var vnode = { tag: tag, attrs: {}, events: {}, children: [] };
    for (var a = 0; a < node.attributes.length; a++) {
      var attr = node.attributes[a];
      var name = attr.name.toLowerCase();
      if (name.indexOf('hint-') === 0) continue;      // подсказки редактора холста
      var value = interpolate(attr.value, scope, values);
      if (name === 'onclick') vnode.events.click = value;
      else if (name === 'onchange') vnode.events.change = value;
      else if (name === 'oninput') vnode.events.input = value;
      else vnode.attrs[name] = value;
    }
    buildChildren(node, scope, values, vnode.children);
    out.push(vnode);
  }

  function buildChildren(node, scope, values, out) {
    for (var i = 0; i < node.childNodes.length; i++) {
      build(node.childNodes[i], scope, values, out);
    }
  }

  /* ---- дерево описаний -> DOM ---- */

  function hover(el) {
    if (el.__hoverBound) return;
    el.__hoverBound = true;
    el.addEventListener('mouseenter', function () {
      if (el.__hoverStyle) el.style.cssText = (el.__baseStyle || '') + ';' + el.__hoverStyle;
    });
    el.addEventListener('mouseleave', function () {
      el.style.cssText = el.__baseStyle || '';
    });
  }

  function applyAttrs(el, oldAttrs, attrs) {
    Object.keys(oldAttrs).forEach(function (name) {
      if (name in attrs) return;
      if (name === 'style') el.style.cssText = el.__baseStyle = '';
      else if (name === 'checked') el.checked = false;
      else el.removeAttribute(name);
    });

    Object.keys(attrs).forEach(function (name) {
      var value = attrs[name];

      if (name === 'style') {
        var css = value === null || value === undefined ? '' : String(value);
        if (el.__baseStyle !== css) {
          el.__baseStyle = css;
          el.style.cssText = css;
        }
        return;
      }
      if (name === 'style-hover') {
        el.__hoverStyle = value === null || value === undefined ? '' : String(value);
        hover(el);
        return;
      }
      if (name === 'value' && ('value' in el)) {
        var next = value === null || value === undefined ? '' : String(value);
        if (el !== document.activeElement) { if (el.value !== next) el.value = next; else if (next) el.value = next; }
        return;
      }
      if (name === 'checked') {
        el.checked = !!value;
        return;
      }
      if (value === false || value === null || value === undefined) {
        el.removeAttribute(name);
        return;
      }
      var str = String(value);
      if (el.getAttribute(name) !== str) el.setAttribute(name, str);

      return vnode.el;

    vnode.el = el;

    vnode.children.forEach(function (child) { el.appendChild(create(child)); });
    applyAttrs(el, {}, vnode.attrs);
    bindEvents(el, vnode.events);
    return el;
  }

  function sameKind(a, b) {
    if (a.text !== undefined || b.text !== undefined) {
      return a.text !== undefined && b.text !== undefined;
    }
    return a.tag === b.tag;
  }

  function patchNode(oldVnode, vnode) {
    var el = vnode.el = oldVnode.el;
    if (vnode.text !== undefined) {
      if (el.nodeValue !== vnode.text) el.nodeValue = vnode.text;
      return;
    }
    applyAttrs(el, oldVnode.attrs, vnode.attrs);
    bindEvents(el, vnode.events);
    patchChildren(el, oldVnode.children, vnode.children);
  }

  function patchChildren(parent, oldList, list) {
    var count = Math.max(oldList.length, list.length);
    for (var i = 0; i < count; i++) {
      var was = oldList[i];
      var now = list[i];

      if (!now) {
        if (was && was.el && was.el.parentNode === parent) parent.removeChild(was.el);
      } else if (!was) {
        parent.appendChild(create(now));
      } else if (sameKind(was, now)) {
        patchNode(was, now);
      } else {
        parent.replaceChild(create(now), was.el);
      }
    }
  }

  /* ---- компонент ---- */

  function Logic() {
    this.props = {};
  }

  Logic.prototype.setState = function (updater) {
    var patch = typeof updater === 'function' ? updater(this.state) : updater;
    this.state = Object.assign({}, this.state, patch);
    if (this.__onChange) this.__onChange();
  };

  /**
   * mount(template, Component, props, root) — собирает страницу и держит её
   * в актуальном состоянии. Перерисовка откладывается в микрозадачу, чтобы
   * несколько setState подряд давали один проход.
   */
  function mount(template, Component, props, root) {
    var component = new Component();
    component.props = props || {};

    var vnodes = [];
    var scheduled = false;

    function draw() {
      scheduled = false;
      var values;
      try {
        values = component.renderVals();
      } catch (err) {
        console.error('Ошибка renderVals:', err);
        return;
      }
      var next = [];
      var scope = Object.create(null);
      for (var i = 0; i < template.childNodes.length; i++) {
        build(template.childNodes[i], scope, values, next);
      }
      try {
        patchChildren(root, vnodes, next);
        vnodes = next;
      } catch (err) {
        console.error('Ошибка отрисовки:', err);
      }
    }

    component.__onChange = function () {
      if (scheduled) return;
      scheduled = true;
      Promise.resolve().then(draw);
    };

    draw();
    return component;
  }

  global.DCLogic = Logic;
  global.mountPage = mount;
})(window);
</script>

 *
 *  Все обращения к таблице, GitHub и RouterAI идут через Web App:
 *  секреты лежат в Script Properties и в браузер не попадают.

 *  в localStorage этого браузера.
 * ================================================================== */

const CONN_KEY = 'smm-crm.connection';

function loadConn() {
  const empty = { WEBAPP_URL: '', API_TOKEN: '' };
  try {
    const raw = window.localStorage.getItem(CONN_KEY);
    return raw ? Object.assign(empty, JSON.parse(raw)) : empty;
  } catch (e) { return empty; }
}

function storeConn(conn) {
  try { window.localStorage.setItem(CONN_KEY, JSON.stringify(conn)); } catch (e) {}
}

function readBody(res) {
  return res.text().then(function (text) {
    let data = null;
    try { data = JSON.parse(text); } catch (e) {
      throw new Error('Web App ответил не JSON (HTTP ' + res.status + '). Проверьте, что деплой открыт «Все, у кого есть ссылка».');
    }
    if (data.ok === false) throw new Error(data.error || 'ошибка Web App');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return data;
  });
}

function apiGet(conn, action, params) {
  if (!conn.WEBAPP_URL) return Promise.reject(new Error('не задан WEBAPP_URL — откройте Настройки'));
  const qs = ['action=' + encodeURIComponent(action)];
  Object.keys(params || {}).forEach(k => qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k])));
  if (conn.API_TOKEN) qs.push('token=' + encodeURIComponent(conn.API_TOKEN));
  const url = conn.WEBAPP_URL + (conn.WEBAPP_URL.indexOf('?') >= 0 ? '&' : '?') + qs.join('&');
  return fetch(url, { method: 'GET', redirect: 'follow' }).then(readBody);
}

function apiPost(conn, action, body) {
  if (!conn.WEBAPP_URL) return Promise.reject(new Error('не задан WEBAPP_URL — откройте Настройки'));
  const payload = Object.assign({ action: action, token: conn.API_TOKEN || '' }, body || {});
  // Content-Type: text/plain — «простой» запрос без preflight:
  // Apps Script не отвечает на OPTIONS, поэтому application/json здесь не годится.
  return fetch(conn.WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow'
  }).then(readBody);
}

function parseDate(v) {
  if (!v) return null;
  if (v instanceof Date) return v;
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? d(Number(m[1]), Number(m[2]), Number(m[3])) : null;
}

function isoDate(dt) {
  if (!dt) return '';
  const p = n => (n < 10 ? '0' : '') + n;
  return dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate());
}

function padAnswers(v) {
  const arr = (Array.isArray(v) ? v : []).map(x => String(x || ''));
  while (arr.length < 5) arr.push('');
  return arr.slice(0, 5);
}

const SETTING_HINT_LOCKED = 'Секреты задаются в Apps Script: Настройки проекта → Свойства скрипта. В браузер они не передаются.';
const PING_NAMES = { sheet: 'Таблица', github: 'GitHub', routerai: 'RouterAI', telegram: 'Telegram' };

const PAY = {
  paid: { label: 'Оплачено', bg: '#e6f4ec', fg: '#136c41', bd: '#c3e3d1' },
  due: { label: 'Ждёт оплаты', bg: '#fbf0da', fg: '#8a5a00', bd: '#eddcb4' },
  overdue: { label: 'Просрочка', bg: '#fbe9e7', fg: '#a91f18', bd: '#f0cdc9' },
  test: { label: 'Тест без оплаты', bg: '#eef1fe', fg: '#2b4acf', bd: '#d3dbfa' },
  brief: { label: 'Новый бриф', bg: '#f1f1ed', fg: '#5d636b', bd: '#e2e2dd' }
};
const PILL = 'display: inline-block; font-size: 11.5px; font-weight: 500; padding: 3px 8px; border-radius: 4px; white-space: nowrap;';

class Component extends DCLogic {
  state = {
    view: 'list', current: '', tab: 'brief', q: '', filter: 'Все',
    clients: [], busy: null, copied: null, toast: null, saved: false, pushed: false,
    briefs: [], log: [], logFilter: 'Все',
    conn: loadConn(), props: {}, demo: false, loading: true, syncAt: 'загрузка…',
    settingsSaved: false, tested: null, deployed: {},
    showNew: false, form: { business: '', name: '', phone: '', email: '', tg: '', city: 'Санкт-Петербург' },
    newTariff: 'ПРО', newSource: 'Avito'
  };

  /* ---- загрузка данных ------------------------------------------- */

  /** Первая загрузка — из renderVals, чтобы не зависеть от жизненного цикла. */
  bootOnce() {
    if (this._booted) return;
    this._booted = true;
    setTimeout(() => this.boot(), 0);
  }

  /** GET clients + briefs + log + settings. Без WEBAPP_URL — демо-режим. */
  boot(silent) {
    const conn = this.state.conn;
    if (!conn.WEBAPP_URL) {
      this.setState({
        clients: DATA.map(c => Object.assign({}, c, { active: c.active !== false })),
        briefs: BRIEFS.map(b => Object.assign({}, b)), log: LOG.slice(),
        demo: true, loading: false, syncAt: 'демо-данные', props: {},
        current: DATA[0] ? DATA[0].id : ''
      });
      return;
    }
    if (!silent) this.setState({ loading: true, syncAt: 'загрузка…' });
    Promise.all([
      apiGet(conn, 'clients'),
      apiGet(conn, 'briefs'),
      apiGet(conn, 'log'),
      apiGet(conn, 'settings')
    ]).then(res => {
      const clients = (res[0].clients || []).map(fromApi);
      this.setState(s => ({
        clients: clients,
        briefs: res[1].briefs || [],
        log: res[2].log || [],
        props: res[3].props || {},
        demo: false, loading: false, syncAt: res[0].at || '—',
        current: clients.some(c => c.id === s.current) ? s.current : (clients[0] ? clients[0].id : '')
      }));
    }).catch(err => {
      this.setState({ loading: false, demo: false, syncAt: 'нет связи' });
      this.flash('Не удалось загрузить данные: ' + err.message);
    });
  }

  /**
   * Одно действие за раз: remote() уходит в Web App, local() — то же
   * самое «на месте», когда бэкенд не подключён (демо-режим).
   */
  act(key, remote, local) {
    if (this.state.busy) return;
    this.setState({ busy: key });
    const done = () => this.setState({ busy: null });
    if (this.state.demo) {
      setTimeout(() => { done(); if (local) local(); }, 500);
      return;
    }
    remote().then(done, err => {
      done();
      this.flash('Ошибка: ' + ((err && err.message) || err));
    });
  }

  /** Ответ Web App -> состояние. edits — поле интерфейса, его не трогаем. */
  applyClient(raw, extra) {
    if (!raw) return;
    const next = fromApi(raw);
    this.setState(s => ({
      clients: s.clients.map(x => (x.id === next.id
        ? Object.assign({}, next, { edits: x.edits }, extra || {})
        : x)),
      syncAt: s.syncAt
    }));
  }

  /** Тихо сохраняет изменение одного-двух полей (переключатели, чек-лист). */
  quietSave(id, changes, revert) {
    if (this.state.demo) return;
    apiPost(this.state.conn, 'save', { client: Object.assign({ id: id }, changes) })
      .catch(err => {
        if (revert) this.patch(id, revert);
        this.flash('Не сохранилось: ' + err.message);
      });
  }

  uniqueId(base) {
    const taken = this.state.clients.map(c => c.id);
    let id = base || 'client';
    let n = 2;
    while (taken.indexOf(id) >= 0) { id = base + '-' + n; n++; }
    return id;
  }

  translit(s) {
    const M = { а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z', и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'c', ч: 'ch', ш: 'sh', щ: 'sch', ъ: '', ы: 'y', ь: '', э: 'e', ю: 'yu', я: 'ya' };
    return (s || '').toLowerCase().split('').map(ch => (M[ch] !== undefined ? M[ch] : /[a-z0-9]/.test(ch) ? ch : '-'))
      .join('').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 24);
  }

  flash(msg) {
    clearTimeout(this._t);
    this.setState({ toast: msg });
    this._t = setTimeout(() => this.setState({ toast: null }), 3200);
  }

  patch(id, changes) {
    this.setState(s => ({ clients: s.clients.map(c => (c.id === id ? Object.assign({}, c, changes) : c)) }));
  }

  cur() { return this.state.clients.find(c => c.id === this.state.current) || this.state.clients[0] || BLANK; }

  copy(text, key, msg) {
    try { navigator.clipboard && navigator.clipboard.writeText(text); } catch (e) {}
    clearTimeout(this._c);
    this.setState({ copied: key });
    this._c = setTimeout(() => this.setState({ copied: null }), 1600);
    if (msg) this.flash(msg);
  }

  btn(kind, extra) {
    const accent = this.props.accent || '#2b4acf';
    const base = 'font-size: 12.5px; font-weight: 500; padding: 8px 13px; border-radius: 5px; cursor: pointer; ';
    if (kind === 'primary') return base + 'border: 1px solid ' + accent + '; background: ' + accent + '; color: #fff;' + (extra || '');
    if (kind === 'ghost') return base + 'border: 1px solid #d9d9d4; background: #fff;' + (extra || '');
    if (kind === 'danger') return base + 'border: 1px solid #a91f18; background: #a91f18; color: #fff;' + (extra || '');
    return base + 'border: 1px solid #e2e2dd; background: #f4f4f1; color: #9a9ea4; cursor: not-allowed;' + (extra || '');
  }

  renderVals() {
    this.bootOnce();

    const st = this.state;
    const conn = st.conn;
    const accent = this.props.accent || '#2b4acf';
    const dense = (this.props.density || 'Обычная') === 'Плотная';
    const rowPad = dense ? '8px 14px' : '12px 14px';
    const cs = st.clients;
    const c = this.cur();
    const busy = st.busy;

    const payOf = k => PAY[k] || PAY.brief;
    const pillOf = k => PILL + 'background: ' + payOf(k).bg + '; color: ' + payOf(k).fg + '; border: 1px solid ' + payOf(k).bd + ';';
    const slotLabel = c2 => (c2.slots.length ? c2.slots.map(k => (SLOTS.find(s => s.key === k) || { label: k }).label).join(' + ') : '—');

    const q = st.q.trim().toLowerCase();
    const filtered = cs.filter(x => {
      const matchQ = !q || [x.business, x.name, x.city, x.id, x.niche].join(' ').toLowerCase().indexOf(q) >= 0;
      const f = st.filter;
      const matchF = f === 'Все' ? true
        : f === 'Неактивные' ? !x.active
        : f === 'Оплачено' ? x.pay === 'paid'
        : f === 'Ждут' ? x.pay === 'due' || x.pay === 'brief'
        : x.pay === 'overdue';
      return matchQ && matchF;
    });

    const rows = filtered.map(x => ({
      business: x.business,
      sub: x.name + ' · ' + x.niche + ' · ' + x.city,
      tariff: x.tariff, slots: slotLabel(x),
      payLabel: payOf(x.pay).label, payStyle: pillOf(x.pay),
      nextPay: fmt(x.nextPay),
      lastPost: x.lastPostStatus.indexOf('Ошибка') === 0 ? '⚠ ' + x.lastPostDate : x.lastPostDate,
      rowStyle: 'display: grid; grid-template-columns: minmax(150px, 2fr) 62px 100px 88px minmax(104px, 1fr) 58px; gap: 10px; min-width: 620px; padding: ' + rowPad + '; border-bottom: 1px solid #f1f1ed; cursor: pointer; align-items: start; opacity: ' + (x.active ? 1 : 0.55) + ';',
      toggleStyle: 'width: 34px; height: 19px; border-radius: 10px; border: none; padding: 2px; cursor: pointer; display: flex; justify-content: ' + (x.active ? 'flex-end' : 'flex-start') + '; background: ' + (x.active ? accent : '#cfd0cc') + ';',
      knobStyle: 'display: block; width: 15px; height: 15px; border-radius: 50%; background: #fff;',
      onOpen: () => this.setState({ view: 'card', current: x.id, tab: 'brief' }),
      // переключатель «активен» сохраняется сразу, с откатом при ошибке
      onToggle: e => {
        e.stopPropagation();
        const next = !x.active;
        this.patch(x.id, { active: next });
        this.quietSave(x.id, { active: next }, { active: x.active });
      }
    }));

    const filters = ['Все', 'Оплачено', 'Ждут', 'Просрочка', 'Неактивные'].map(f => ({
      label: f,
      onClick: () => this.setState({ filter: f }),
      style: 'border: none; cursor: pointer; font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 4px; ' +
        (st.filter === f ? 'background: #fff; color: #14171a; box-shadow: 0 1px 2px rgba(0,0,0,0.07);' : 'background: none; color: #6b7078;')
    }));

    const tabs = [
      { key: 'brief', label: 'Бриф' },
      { key: 'onboarding', label: 'Онбординг' },
      { key: 'content', label: 'Согласование контента' },
      { key: 'payments', label: 'Оплаты' }
    ].map(t => ({
      label: t.label,
      onClick: () => this.setState({ tab: t.key }),
      style: 'border: none; background: none; cursor: pointer; font-size: 13px; padding: 9px 12px; margin-bottom: -1px; ' +
        (st.tab === t.key
          ? 'font-weight: 600; color: #14171a; border-bottom: 2px solid ' + accent + ';'
          : 'font-weight: 500; color: #6b7078; border-bottom: 2px solid transparent;')
    }));

    const setter = key => e => this.patch(c.id, { [key]: e.target.value, });
    const set = {};
    ['business', 'city', 'about', 'audience', 'tone', 'holidays', 'faq', 'cta', 'limitsText', 'name', 'phone', 'tg', 'email', 'stylePrompt', 'styleSourceText', 'edits', 'tgChannel', 'holidaysExtra'].forEach(k => { set[k] = setter(k); });

    const chip = (on, label, onClick) => ({
      label, onClick,
      style: 'border: 1px solid ' + (on ? accent : '#dedeD9') + '; background: ' + (on ? '#eef1fe' : '#fff') + '; color: ' + (on ? accent : '#5d636b') + '; font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 14px; cursor: pointer;'
    });

    const toggleIn = (key, val) => {
      const arr = c[key].indexOf(val) >= 0 ? c[key].filter(v => v !== val) : c[key].concat([val]);
      this.patch(c.id, { [key]: arr });
    };

    // подбор нишевых праздников по ключевым словам — без вызова AI:
    // заранее проверенный список, только фиксированные даты
    const nicheText = ((c.niche || '') + ' ' + (c.about || '')).toLowerCase();
    const norm = s2 => s2.replace(/\s+/g, ' ').trim();
    const holidayLines = (c.holidaysExtra || '').split('\n').map(norm).filter(Boolean);
    const seenNiche = new Set();
    const nicheSuggestions = [];
    NICHE_HOLIDAY_SUGGESTIONS.forEach(group => {
      if (!group.match.some(k => nicheText.indexOf(k) >= 0)) return;
      group.holidays.forEach(h => {
        const line = norm(h.date + ' ' + h.name);
        if (seenNiche.has(line)) return;
        seenNiche.add(line);
        nicheSuggestions.push({ line, name: h.name });
      });
    });
    const nicheHolidayChips = nicheSuggestions.map(sg => {
      const on = holidayLines.indexOf(sg.line) >= 0;
      return chip(on, sg.name, () => {
        const current = (c.holidaysExtra || '').split('\n').map(norm).filter(Boolean);
        const next = on ? current.filter(l => l !== sg.line) : current.concat([sg.line]);
        this.patch(c.id, { holidaysExtra: next.join('\n') });
      });
    });

    const doneCount = CHECKS.filter(k => c.checks[k.key]).length;
    const styleFilled = c.styleAnswers.filter(a => a.trim()).length;
    const maxSlots = c.tariff === 'СТАРТ' ? 1 : 2;

    const reminders = c.nextPay ? [
      { label: 'За 3 дня', date: fmt(shift(c.nextPay, -3)) },
      { label: 'За 1 день', date: fmt(shift(c.nextPay, -1)) },
      { label: 'В день оплаты', date: fmt(c.nextPay) },
      { label: 'При просрочке — ежедневно', date: 'с ' + fmt(shift(c.nextPay, 1)) }
    ] : [{ label: 'Оплата не назначена — бриф не обработан', date: '—' }];

    const dep = st.deployed[c.id] || (c.configPushed ? { sha: String(c.configPushed).split(' · ')[0], prevSha: '—', at: String(c.configPushed).split(' · ')[1] || '' } : null);
    // тот же конфиг, что соберёт Web App перед коммитом в GitHub
    const cfg = JSON.stringify({
      client_id: c.id,
      business: c.business,
      city: c.city,
      tariff: c.tariff,
      networks: c.networks.map(n => n.toLowerCase()),
      slots: c.slots.map(k => ({ name: k, cron: (SLOTS.find(s => s.key === k) || { times: '' }).times.split(' ')[0] })),
      style_prompt: c.stylePrompt || null,
      tone: c.tone,
      holidays: c.holidays,
      forbidden: c.limits.concat(c.limitsText ? [c.limitsText] : []),
      cta: c.cta,
      faq: c.faq ? c.faq.split('\n') : [],
      rubrics: c.rubrics.map(r => ({ name: r.name, days: r.days.split(',').map(d2 => d2.trim()), prompt: r.prompt, manual: !!r.manual })),
      tg_channel: c.tgChannel || null,
      morning_photo: !!c.morningPhoto,
      holidays_extra: c.holidaysExtra || '',
      yandex_folder: 'clients/' + c.id,
      active: c.active !== false,
      iterations: c.iterations
    }, null, 2);
    const cfgBytes = new Blob([cfg]).size;

    return {
      syncedAt: st.demo ? 'демо-данные' : st.loading ? 'загрузка…' : st.syncAt,
      isList: st.view === 'list', isCard: st.view === 'card',
      isPayments: st.view === 'payments', isBriefs: st.view === 'briefs',
      isLog: st.view === 'log', isSettings: st.view === 'settings',
      navItems: [
        { key: 'list', label: 'Клиенты', badge: String(cs.length), tone: 'plain' },
        { key: 'payments', label: 'Оплаты', badge: cs.filter(x => x.pay === 'overdue').length ? String(cs.filter(x => x.pay === 'overdue').length) : '', tone: 'red' },
        { key: 'briefs', label: 'Брифы', badge: st.briefs.length ? String(st.briefs.length) : '', tone: 'amber' },
        { key: 'log', label: 'Лог публикаций', badge: '', tone: 'plain' },
        { key: 'settings', label: 'Настройки', badge: st.demo || !conn.WEBAPP_URL ? '!' : '', tone: 'red' }
      ].map(n => {
        const on = st.view === n.key || (n.key === 'list' && st.view === 'card');
        const tones = {
          plain: 'background: #eeeeea; color: #6b7078;',
          amber: 'background: #fbf0da; color: #8a5a00;',
          red: 'background: #fbe9e7; color: #a91f18;'
        };
        return {
          label: n.label, badge: n.badge,
          // повторный клик по текущему разделу — перезагрузка данных из таблицы
          onClick: () => {
            if (st.view === n.key && n.key !== 'settings') { this.boot(true); this.flash('Обновляю из таблицы…'); }
            else this.setState({ view: n.key });
          },
          style: 'display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: none; padding: 8px 10px; border-radius: 5px; font-size: 13px; cursor: pointer; font-family: inherit; ' +
            (on ? 'background: #14171a; color: #fbfbf9; font-weight: 600;' : 'background: none; color: #5d636b; font-weight: 400;'),
          badgeStyle: n.badge
            ? 'font-family: \'IBM Plex Mono\', monospace; font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 3px; ' + (on ? 'background: rgba(255,255,255,0.16); color: #f4f4f1;' : tones[n.tone])
            : 'display: none;'
        };
      }),

      showNew: st.showNew,
      openNew: () => this.setState({ showNew: true }),
      closeNew: () => this.setState({ showNew: false }),
      newTariff: st.newTariff, newSource: st.newSource,
      setNewTariff: e => this.setState({ newTariff: e.target.value }),
      setNewSource: e => this.setState({ newSource: e.target.value }),
      newId: st.form.business.trim()
        ? (function (base, taken) {
            const uniq = (function () { let id = base || 'client', n = 2; while (taken.indexOf(id) >= 0) { id = base + '-' + n; n++; } return id; })();
            return uniq === base ? uniq : uniq + '  (базовый ' + base + ' уже занят)';
          })(this.translit(st.form.business) || 'client', cs.map(x => x.id))
        : '—',
      newFields: [

      planBtn: busy ? this.btn('off') : this.btn('ghost'),
      buildPlan: () => this.act('plan',
        () => apiPost(conn, 'build_plan', { id: c.id, client: toApi(c) }).then(r => {
          this.applyClient(r.client);
          this.flash((r.rubrics || []).length + ' рубрик получены — правьте промпты руками');
        }),
        () => {
          this.patch(c.id, {
            rubrics: [
              { name: 'Полезное по теме', days: 'пн', prompt: 'Образовательный пост по нише без конкретных ставок, сроков и гарантий.', example: '' },
              { name: 'Частые вопросы', days: 'вт, чт', prompt: 'Ответ на вопрос из FAQ, 3–4 предложения, разговорным языком.', example: '' },
              { name: 'Фото работ', days: 'ср', prompt: 'Пост по фото из to_post: контекст, что сделали, результат.', example: '' },
              { name: 'Идеи и вдохновение', days: 'пт', prompt: 'Что можно заказать или сделать — с примерами из практики.', example: '' },
              { name: 'Отзывы и результаты', days: 'сб', prompt: 'Пересказ отзыва без имён, акцент на пользу для клиента.', example: '' }
            ]
          });
          this.flash('Демо: план не от модели');
        }),

      // RouterAI: пример поста для каждой рубрики с учётом style_prompt
      examplesLabel: busy === 'ex' ? 'Пишу примеры…' : 'Сгенерировать примеры',
      examplesBtn: !c.rubrics.length || busy ? this.btn('off') : this.btn('ghost'),
      genExamples: () => {
        if (!c.rubrics.length) return this.flash('Сначала соберите контент-план');
        this.act('ex',
          () => apiPost(conn, 'gen_examples', { id: c.id, client: toApi(c) }).then(r => {
            this.applyClient(r.client);
            this.flash('Примеры готовы — копируйте клиенту в Telegram');
          }),
          () => {
            this.patch(c.id, {
              rubrics: c.rubrics.map(r => Object.assign({}, r, {
                example: r.example || 'Пример поста по рубрике «' + r.name + '» с учётом style_prompt. Короткие фразы, обращение на «вы», в конце — заглушка с призывом.'
              }))
            });
            this.flash('Демо: примеры не от модели');
          });
      },
      rubrics: c.rubrics.map((r, i) => {
        const upd = (key, val) => this.patch(c.id, { rubrics: c.rubrics.map((x, j) => (j === i ? Object.assign({}, x, { [key]: val }) : x)) });
        return {
          name: r.name, days: r.days, prompt: r.prompt, example: r.example || '— примера ещё нет',
          nameBorder: r.manual ? '#2b4acf' : '#e6e6e1',
          lockIcon: r.manual ? '🔒' : '🔓',
          lockTitle: r.manual ? 'Зафиксировано — не удалится при пересборке плана. Нажми чтобы разблокировать.' : 'Нажми чтобы зафиксировать рубрику — она сохранится при пересборке плана.',
          lockStyle: 'border: 1px solid ' + (r.manual ? '#2b4acf' : '#e6e6e1') + '; background: ' + (r.manual ? '#eef1fe' : '#fff') + '; font-size: 12px; line-height: 1; padding: 4px 0; border-radius: 4px; cursor: pointer; width: 100%;',
          onLock: () => {
            const updated = c.rubrics.map((x, j) => j === i ? Object.assign({}, x, { manual: !x.manual }) : x);
            this.patch(c.id, { rubrics: updated });
          },
          setName: e => upd('name', e.target.value),
          setDays: e => upd('days', e.target.value),
          setPrompt: e => upd('prompt', e.target.value),
          copyLabel: st.copied === 'r' + i ? 'Скопировано ✓' : 'Скопировать',
          copyBtn: 'margin-top: 6px; border: 1px solid ' + (r.example ? '#dedeD9' : '#eeeeea') + '; background: #fff; color: ' + (r.example ? '#14171a' : '#a3a7ac') + '; font-size: 11.5px; padding: 4px 9px; border-radius: 4px; cursor: pointer;',
          onCopy: () => { if (r.example) this.copy(r.example, 'r' + i); },
          onRemove: () => this.patch(c.id, { rubrics: c.rubrics.filter((x, j) => j !== i) }),
          onCopyPrompt: null
        };
      }),
      addRubric: () => this.patch(c.id, { rubrics: c.rubrics.concat([{ name: 'Новая рубрика', days: 'пн', prompt: '', example: '', manual: true }]) }),

      // RouterAI: правки клиента -> обновлённые промпты рубрик
      applyLabel: busy === 'edits' ? 'Обновляю промпты…' : 'Применить правки',
      applyBtn: !c.edits.trim() || busy ? this.btn('off') : this.btn('ghost'),
      applyEdits: () => {
        if (!c.edits.trim()) return this.flash('Вставьте правки клиента');
        this.act('edits',
          () => apiPost(conn, 'apply_edits', { id: c.id, client: toApi(c), edits: c.edits }).then(r => {
            this.applyClient(r.client, { edits: '' });
            this.flash('Промпты и примеры обновлены — итерация ' + r.iterations);
          }),
          () => {
            this.patch(c.id, {
              iterations: c.iterations + 1, edits: '',
              rubrics: c.rubrics.map(r => Object.assign({}, r, {
                prompt: r.prompt + ' Учесть правки клиента.',
                example: 'Обновлённый пример по рубрике «' + r.name + '» с учётом правок клиента.'
              }))
            });
            this.flash('Демо: правки применены только в интерфейсе');
          });
      },

      launchLabel: busy === 'launch' ? 'Коммичу конфиг…' : dep ? 'Обновить конфиг' : 'Сохранить и запустить',
      testLabel: busy === 'test' ? 'Запускаю…' : '▶ Тест',
      testBtn: busy ? this.btn('off') : 'border: 1px solid #2b4acf; background: #eef1fe; color: #2b4acf; font-size: 12.5px; font-weight: 500; padding: 8px 13px; border-radius: 5px; cursor: pointer;',
      configJson: cfg,
      deployLabel: busy === 'launch' ? 'PUT в процессе' : dep ? 'закоммичен · ' + dep.sha : 'не закоммичен',
      deployStyle: PILL + (busy === 'launch'
        ? 'background: #eef1fe; color: #2b4acf; border: 1px solid #d3dbfa;'
        : dep
          ? 'background: #e6f4ec; color: #136c41; border: 1px solid #c3e3d1;'
          : 'background: #f1f1ed; color: #5d636b; border: 1px solid #e2e2dd;') + ' font-family: \'IBM Plex Mono\', monospace;',
      deploySteps: [
        { label: 'Конфиг собран из брифа и рубрик', detail: cfgBytes + ' байт · ' + c.rubrics.length + ' рубрик · ' + c.slots.length + ' слотов', ok: !!c.rubrics.length },
        { label: 'GET sha текущего файла', detail: dep && dep.prevSha && dep.prevSha !== '—' ? 'sha ' + dep.prevSha : 'файла ещё нет — создание', ok: true },
        { label: 'PUT contents/clients/' + c.id + '.json', detail: dep ? 'commit ' + dep.sha + (dep.at ? ' · ' + dep.at : '') : 'ожидает запуска', ok: !!dep },
        { label: 'workflow_dispatch clients-post.yml', detail: dep ? (dep.note || 'тестовый прогон запущен') : 'запустится после коммита', ok: !!dep }
      ].map(s => ({
        label: s.label, detail: s.detail,
        dot: 'flex: none; width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; background: ' + (s.ok ? '#136c41' : '#cfd0cc') + ';'
      })),
      copyConfigLabel: st.copied === 'cfg' ? 'Скопировано ✓' : 'Скопировать конфиг',
      copyConfig: () => this.copy(cfg, 'cfg'),

      // то же, что кнопка «Отправить в репозиторий», но из вкладки согласования
      // Тест: только dispatch без коммита — проверяем что пост выходит
      // в канал клиента, не трогая конфиг в репозитории
      onTest: () => this.act('test',
        () => apiPost(conn, 'dispatch_test', { id: c.id }).then(r => {
          this.flash('Тестовый пост запущен — проверь канал через 30 секунд · ' + (r.note || ''));
        }),
        () => {
          this.flash('Демо: dispatch не отправлен — задайте WEBAPP_URL');
        }),

      onLaunch: () => this.act('launch',
        () => apiPost(conn, 'push', { id: c.id, client: toApi(c) }).then(r => {
          this.applyClient(r.client);
          this.setState(s => ({
            deployed: Object.assign({}, s.deployed, {
              [c.id]: { sha: r.sha, prevSha: r.prevSha, at: r.at, note: r.workflowNote || '' }
            })
          }));
          this.flash('PUT ' + r.path + ' — commit ' + r.sha +
            (r.dispatched ? ', workflow запущен' : (r.workflowNote ? ' · ' + r.workflowNote : '')));
        }),
        () => {
          const sha = Math.random().toString(16).slice(2, 9);
          this.patch(c.id, {
            checks: Object.assign({}, c.checks, { config: true }),
            lastPostStatus: c.lastPostStatus === 'Не запущен' ? 'Опубликован' : c.lastPostStatus
          });
          this.setState(s => ({
            deployed: Object.assign({}, s.deployed, {
              [c.id]: { sha, prevSha: dep ? dep.sha : '—', at: 'демо', note: 'демо-режим' }
            })
          }));
          this.flash('Демо: коммита не было — задайте WEBAPP_URL');
        }),

      // Оплатами управляет дропдаун в листе «Клиенты» (Apps Script сам
      // сдвигает дату и красит статус), поэтому здесь только ссылка на
      // нужную строку — открывается сразу на ячейке статуса.
      payRaw: c.payRaw || '—',
      sheetBtnLabel: 'Открыть строку в таблице',
      sheetBtnStyle: this.btn('primary', ' width: 100%; margin-top: 14px;'),
      payHint: 'Оплату отмечайте дропдауном в колонке «Статус»: «Оплачено N мес» сдвигает дату, «Отменить оплату» возвращает назад.',
      openRow: () => {
        if (!c.rowUrl) return this.flash(st.demo
          ? 'Демо-режим: задайте WEBAPP_URL, чтобы открыть строку в таблице'
          : 'Для этого клиента нет ссылки на строку — обновите список');
        try { window.open(c.rowUrl, '_blank'); } catch (e) { this.flash('Не удалось открыть таблицу'); }
      },
      reminders,
      hasToast: !!st.toast, toast: st.toast
    };
  }
}

mountPage(
  document.getElementById('crm-template').content,
  Component,
  {
  "density": "Обычная",
  "showStats": true,
  "accent": "#2b4acf"
},
  document.getElementById('crm-root')
);
</script>

</body>
</html>
